<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b5fff" />
<title>CME Real Estate and Properties — USA & Ecuador</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.1/mapbox-gl.js"></script>

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --ink:#0a1628;
  --ink-2:#2b3a4f;
  --muted:#65748a;
  --line:#e7ecf3;
  --line-2:#eff3f8;
  --bg:#f5f7fb;
  --card:#ffffff;
  --brand:#0b5fff;
  --brand-2:#3b82f6;
  --brand-dark:#0846d4;
  --brand-soft:#eaf1ff;
  --brand-glow:rgba(11,95,255,.24);
  --accent:#0e9f6e;
  --accent-soft:#e6f7ef;
  --whatsapp:#25D366;
  --danger:#e8453c;
  --radius-xl:22px;
  --radius-lg:16px;
  --radius-md:12px;
  --shadow-xs:0 1px 2px rgba(10,22,40,.04),0 1px 3px rgba(10,22,40,.06);
  --shadow-sm:0 2px 6px rgba(10,22,40,.05),0 4px 14px rgba(10,22,40,.04);
  --shadow-md:0 6px 20px rgba(10,22,40,.09),0 2px 6px rgba(10,22,40,.05);
  --shadow-lg:0 24px 60px rgba(10,22,40,.16),0 6px 20px rgba(10,22,40,.08);
  --shadow-xl:0 32px 80px rgba(10,22,40,.22);
  --shadow-brand:0 12px 32px rgba(11,95,255,.32);
  --header-h:76px;
  --serif:'Fraunces',Georgia,serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--brand);color:#fff}
[hidden]{display:none !important}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

.results::-webkit-scrollbar,.drawer::-webkit-scrollbar,.filters::-webkit-scrollbar{width:10px}
.results::-webkit-scrollbar-thumb,.drawer::-webkit-scrollbar-thumb,.filters::-webkit-scrollbar-thumb{background:#d3dae3;border-radius:99px;border:3px solid transparent;background-clip:content-box}

/* ============================================================
   HEADER
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:800;height:var(--header-h);
  display:flex;align-items:center;gap:20px;padding:0 28px;
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand-mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3b82f6 0%,#0b5fff 55%,#0846d4 100%);
  box-shadow:0 8px 20px rgba(11,95,255,.30),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;overflow:hidden;flex:0 0 auto;
}
.brand-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 40%,rgba(255,255,255,.16));pointer-events:none}
.brand-mark svg{width:20px;height:20px;fill:#fff;position:relative;z-index:1}
.brand-text{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-name{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.brand-sub{font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--brand);white-space:nowrap;margin-top:3px}

.mode-toggle{display:flex;position:relative;flex:0 0 auto;padding:4px;background:#eef2f8;border-radius:999px;box-shadow:inset 0 1px 3px rgba(10,22,40,.06)}
.mode-toggle::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:999px;box-shadow:0 2px 8px rgba(10,22,40,.12);transition:transform .32s cubic-bezier(.22,.9,.3,1)}
.mode-toggle[data-mode="rent"]::before{transform:translateX(100%)}
.mode-toggle button{position:relative;z-index:1;min-width:74px;padding:8px 18px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted);transition:color .22s ease}
.mode-toggle button.active{color:var(--ink)}

.region-toggle{display:flex;gap:6px;flex:0 0 auto}
.region-toggle button{padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--muted);transition:all .18s ease}
.region-toggle button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.searchbar{position:relative;flex:1 1 auto;max-width:600px;min-width:0}
.searchbar>svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#8a97a8;fill:none;stroke-width:2;pointer-events:none}
.searchbar input{width:100%;height:46px;padding:0 20px 0 48px;border:1.5px solid transparent;border-radius:999px;background:#eff3f8;font-size:14.5px;font-weight:500;outline:none;transition:background .18s ease,box-shadow .18s ease,border-color .18s ease}
.searchbar input::placeholder{color:#8a97a8;font-weight:500}
.searchbar input:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 4px rgba(11,95,255,.14)}

.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav-link{padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:background .16s ease,color .16s ease}
.nav-link:hover{background:#eff3f8;color:var(--ink)}
.nav-link.dim{color:var(--muted)}

.btn-saved{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 16px 0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:700;transition:border-color .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease}
.btn-saved svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;color:#94a3b5;transition:.18s}
.btn-saved:hover{border-color:#cfd8e3;background:#fbfcfe;box-shadow:var(--shadow-xs)}
.btn-saved.active{background:linear-gradient(135deg,#3b82f6,#0b5fff);border-color:transparent;color:#fff;box-shadow:var(--shadow-brand)}
.btn-saved.active svg{fill:#fff;stroke:#fff;color:#fff}
.btn-saved .count{min-width:22px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:800;background:#eff3f8;color:var(--ink-2);transition:background .18s ease,color .18s ease}
.btn-saved.active .count{background:rgba(255,255,255,.25);color:#fff}

.btn-filter{display:none;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:700;position:relative}
.btn-filter svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn-filter .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--brand);color:#fff;box-shadow:0 2px 6px var(--brand-glow);transform:scale(0);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.btn-filter .badge.show{transform:scale(1)}

/* ============================================================
   APP LAYOUT
   ============================================================ */
.app{display:grid;grid-template-columns:296px minmax(0,1fr) minmax(380px,42%);height:calc(100vh - var(--header-h))}

.filters{padding:26px 22px 100px;background:#fff;border-right:1px solid var(--line);overflow-y:auto}
.filters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.filters-head h2{margin:0;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.link-reset{font-size:12.5px;font-weight:700;color:var(--brand);padding:6px 10px;border-radius:8px;transition:background .16s ease}
.link-reset:hover{background:var(--brand-soft)}

.filter-section{padding:20px 0;border-bottom:1px solid var(--line-2)}
.filter-section:first-of-type{padding-top:0}
.filter-section:last-of-type{border-bottom:0}
.filter-section h3{margin:0 0 14px;font-size:13px;font-weight:700;color:var(--ink)}

.price-display{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.price-display .val{padding:4px 10px;background:var(--brand-soft);border-radius:8px;color:var(--brand-dark);font-size:12.5px}

.range-slider{position:relative;height:40px;padding:0 2px;margin-bottom:4px}
.range-track{position:absolute;top:50%;left:0;right:0;height:6px;transform:translateY(-50%);background:#e7ecf3;border-radius:3px}
.range-fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#3b82f6,#0b5fff);border-radius:3px;box-shadow:0 1px 4px var(--brand-glow)}
.range-slider input[type=range]{position:absolute;top:0;left:0;right:0;width:100%;height:100%;background:transparent;pointer-events:none;-webkit-appearance:none;appearance:none;margin:0;padding:0}
.range-slider input[type=range]::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:grab;box-shadow:0 2px 8px rgba(10,22,40,.2),0 0 0 4px rgba(11,95,255,.08);transition:transform .15s ease,box-shadow .15s ease}
.range-slider input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.1);box-shadow:0 3px 12px rgba(10,22,40,.25),0 0 0 6px rgba(11,95,255,.12)}
.range-slider input[type=range]::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:grab;box-shadow:0 2px 8px rgba(10,22,40,.2),0 0 0 4px rgba(11,95,255,.08)}

.chip-row{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink-2);transition:all .18s cubic-bezier(.2,.8,.3,1);white-space:nowrap}
.chip:hover{border-color:#c5d1e0;background:#fbfcfe;transform:translateY(-1px)}
.chip.active{background:linear-gradient(135deg,#3b82f6,#0b5fff);border-color:transparent;color:#fff;box-shadow:0 6px 16px var(--brand-glow);transform:translateY(-1px)}

.side-card{margin-top:26px;padding:18px;border-radius:var(--radius-lg);background:linear-gradient(155deg,#eef4ff 0%,#e0ebff 100%);border:1px solid #d4e3ff;position:relative;overflow:hidden}
.side-card::before{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(11,95,255,.14),transparent 70%);pointer-events:none}
.side-card h3{margin:0 0 6px;font-size:14px;font-weight:800;position:relative}
.side-card p{margin:0 0 14px;font-size:12.5px;color:#4c5d75;line-height:1.55;position:relative}
.side-card button{width:100%;height:40px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#0b5fff);color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 4px 12px var(--brand-glow);transition:transform .15s ease,box-shadow .15s ease;position:relative}
.side-card button:hover{transform:translateY(-1px);box-shadow:0 8px 20px var(--brand-glow)}

.results{overflow-y:auto;padding:0 32px 100px;scroll-behavior:smooth;position:relative}
.results-head{position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:26px 0 20px;margin-bottom:6px;background:linear-gradient(to bottom,var(--bg) 78%,rgba(245,247,251,0))}
.results-head h1{margin:0;font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.15}
.results-head .sub{margin-top:5px;font-size:13px;color:var(--muted);font-weight:500}
.results-head .sub b{color:var(--ink);font-weight:700}

.sort-wrap{position:relative;flex:0 0 auto}
.sort-wrap>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#8a97a8;fill:none;stroke-width:2;pointer-events:none}
.sort-wrap select{height:40px;padding:0 32px 0 34px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink);outline:none;appearance:none;-webkit-appearance:none;cursor:pointer}
.sort-wrap::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;margin-top:-5px;border-right:2px solid #8a97a8;border-bottom:2px solid #8a97a8;transform:rotate(45deg);pointer-events:none}

.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}

/* ============================================================
   CARD with SLIDESHOW
   ============================================================ */
.card{position:relative;background:var(--card);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(10,22,40,.05),0 2px 8px rgba(10,22,40,.04);transition:transform .32s cubic-bezier(.2,.8,.3,1),box-shadow .32s ease;animation:cardIn .4s ease backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 48px rgba(10,22,40,.14),0 8px 20px rgba(10,22,40,.08)}

.card-media{position:relative;aspect-ratio:4/3;background:#eef1f5;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.3,1);position:absolute;inset:0;opacity:0;transition:opacity .4s ease,transform .6s cubic-bezier(.2,.8,.3,1)}
.card-media img.active{opacity:1}
.card:hover .card-media img.active{transform:scale(1.06)}

.slideshow-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;padding:6px 10px;background:rgba(0,0,0,.35);border-radius:999px;backdrop-filter:blur(8px);opacity:0;transition:opacity .25s ease}
.card:hover .slideshow-dots,.card:focus-within .slideshow-dots{opacity:1}
.slideshow-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:background .2s ease,transform .2s ease;cursor:pointer}
.slideshow-dots span.active{background:#fff;transform:scale(1.3)}

.slide-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(10,22,40,.18);opacity:0;transition:opacity .22s ease,transform .18s ease;pointer-events:none}
.card:hover .slide-arrow{opacity:1;pointer-events:auto}
.slide-arrow:hover{transform:translateY(-50%) scale(1.1);background:#fff}
.slide-arrow.prev{left:10px}
.slide-arrow.next{right:10px}
.slide-arrow svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.4}

.card-media::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(10,22,40,.6) 100%);pointer-events:none;z-index:1}

.card-badges{position:absolute;top:12px;left:12px;z-index:4;display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:5px 10px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.96);box-shadow:0 2px 8px rgba(10,22,40,.16);backdrop-filter:blur(6px)}
.badge--for_sale{color:#0a4fd6;background:rgba(234,241,255,.96)}
.badge--for_rent{color:#0e7a4a;background:rgba(230,247,239,.96)}
.badge--pending{color:#8a5300;background:rgba(255,244,224,.96)}
.badge--sold{color:#4a5768;background:rgba(238,243,248,.96)}
.badge--new{color:#fff;background:linear-gradient(135deg,#12b981,#0e9f6e);box-shadow:0 4px 12px rgba(14,159,110,.35)}

.card-heart{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);box-shadow:0 3px 12px rgba(10,22,40,.2);transition:transform .18s ease,background .18s ease}
.card-heart svg{width:18px;height:18px;stroke:#5d6b7d;fill:transparent;stroke-width:2;transition:fill .18s ease,stroke .18s ease}
.card-heart:hover{transform:scale(1.08);background:#fff}
.card-heart:hover svg{stroke:var(--danger)}
.card-heart.on svg{fill:var(--danger);stroke:var(--danger)}
.card-heart.on{animation:heartPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.28)}70%{transform:scale(.94)}100%{transform:scale(1)}}

.card-price-overlay{position:absolute;bottom:12px;left:14px;right:14px;z-index:3;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-price-overlay .price{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.03em;text-shadow:0 2px 8px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.card-price-overlay .price .suffix{font-size:13px;font-weight:700;color:rgba(255,255,255,.9)}
.card-price-overlay .est{font-size:12px;font-weight:700;color:rgba(255,255,255,.94);padding:4px 9px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:7px;backdrop-filter:blur(6px);text-shadow:0 1px 2px rgba(0,0,0,.15)}

.card-body{padding:15px 16px 17px}
.specs{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.specs span{display:inline-flex;align-items:center;gap:5px}
.specs svg{width:13px;height:13px;stroke:#8a97a8;fill:none;stroke-width:2}
.specs .dot{width:3px;height:3px;border-radius:50%;background:#c5d1e0}
.addr{margin-top:8px;font-size:13px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#8a97a8;font-weight:600}
.meta-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:#f5f7fb;border-radius:6px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.meta-tag svg{width:11px;height:11px;stroke:#8a97a8;fill:none;stroke-width:2}

.empty{grid-column:1/-1;padding:80px 24px;text-align:center;background:#fff;border-radius:var(--radius-lg);border:1.5px dashed #d9e1ea}
.empty-ico{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-soft),#dbe7ff);position:relative}
.empty-ico::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed #c6d9ff;opacity:.6}
.empty-ico svg{width:36px;height:36px;stroke:var(--brand);fill:none;stroke-width:1.8}
.empty h3{margin:0 0 8px;font-size:19px;font-weight:800;color:var(--ink)}
.empty p{margin:0 auto;max-width:360px;font-size:14px;color:var(--muted);line-height:1.65}

.more-wrap{display:flex;justify-content:center;margin-top:36px}
.more{height:48px;padding:0 36px;border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-size:14px;font-weight:700;transition:all .18s ease}
.more:hover{background:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}

/* ============================================================
   MAPBOX MAP
   ============================================================ */
.mapwrap{position:relative;background:#e9eef3;overflow:hidden}
#map{position:absolute;inset:0}
.mapboxgl-map{font-family:inherit}
.mapboxgl-ctrl-attrib{font-size:10.5px !important;background:rgba(255,255,255,.9) !important;border-radius:8px 0 0 0;padding:3px 8px !important}
.mapboxgl-ctrl-group{border-radius:12px !important;box-shadow:var(--shadow-sm) !important;border:0 !important;overflow:hidden}
.mapboxgl-ctrl-group button{width:38px !important;height:38px !important}
.mapboxgl-ctrl-group button:hover{background:#f5f7fb !important}

.pin{cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.pin:hover{transform:scale(1.12);z-index:10}
.pin span{display:inline-block;padding:6px 11px;border-radius:999px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;border:2px solid #fff;box-shadow:0 4px 14px rgba(10,22,40,.2),0 1px 3px rgba(10,22,40,.15);font-variant-numeric:tabular-nums}
.pin.sale span{color:#0a4fd6}
.pin.rent span{color:#0e7a4a}

/* ============================================================
   DETAIL DRAWER
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:900;background:rgba(10,22,40,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .26s ease}
.scrim.show{opacity:1;pointer-events:auto}

.drawer{position:fixed;top:0;right:0;z-index:950;width:min(600px,100%);height:100%;background:#fff;box-shadow:var(--shadow-xl);transform:translateX(103%);transition:transform .34s cubic-bezier(.22,.9,.3,1);overflow-y:auto;overscroll-behavior:contain}
.drawer.open{transform:translateX(0)}

.drawer-hero{position:relative;aspect-ratio:16/10;background:#eef1f5;overflow:hidden}
.drawer-hero img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.drawer-hero img.active{opacity:1}
.drawer-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,22,40,.32) 0%,transparent 40%);pointer-events:none;z-index:1}

.hero-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:3;padding:7px 12px;background:rgba(0,0,0,.4);border-radius:999px;backdrop-filter:blur(10px)}
.hero-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .2s ease;cursor:pointer}
.hero-dots span.active{background:#fff;transform:scale(1.3)}

.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(10,22,40,.24);transition:transform .16s ease,background .16s ease}
.hero-arrow:hover{transform:translateY(-50%) scale(1.08);background:#fff}
.hero-arrow.prev{left:16px}
.hero-arrow.next{right:16px}
.hero-arrow svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.4}

.close-btn{position:absolute;top:18px;right:18px;z-index:5;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(10,22,40,.24);transition:transform .16s ease,background .16s ease}
.close-btn:hover{transform:scale(1.08);background:#fff}
.close-btn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.4;fill:none}

.drawer-body{padding:26px 30px 80px;animation:contentFade .5s ease .1s backwards}
@keyframes contentFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.drow{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.drawer .price-lg{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.drawer .specs-lg{margin-top:8px;font-size:15px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drawer .specs-lg .dot{width:3px;height:3px;border-radius:50%;background:#c5d1e0}
.drawer .addr-lg{margin-top:6px;font-size:14px;color:var(--muted);font-weight:500}

.heart-lg{flex:0 0 auto;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;transition:all .18s ease}
.heart-lg svg{width:22px;height:22px;stroke:#7a8798;fill:transparent;stroke-width:2;transition:fill .18s ease,stroke .18s ease}
.heart-lg:hover{border-color:#f3c3c0;background:#fff8f8;transform:scale(1.05)}
.heart-lg.on{border-color:#f6cfcc;background:#fff5f5}
.heart-lg.on svg{fill:var(--danger);stroke:var(--danger)}

.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pill{padding:7px 13px;border-radius:999px;background:#f5f7fb;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2)}
.pill.brand{background:var(--brand-soft);border-color:#d6e4ff;color:var(--brand-dark)}
.pill.rent{background:var(--accent-soft);border-color:#c8eedd;color:#0e7a4a}

.section-title{margin:32px 0 12px;font-size:14px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--brand),var(--brand-2))}
.drawer p.desc{margin:0;font-size:14.5px;line-height:1.7;color:#3b4d63}

.facts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:1px;border-radius:12px;background:var(--line);overflow:hidden;border:1px solid var(--line)}
.fact{display:flex;flex-direction:column;gap:3px;padding:14px 16px;background:#fff}
.fact span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fact b{font-size:14.5px;font-weight:700;color:var(--ink)}

.calc{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:end;padding:20px;border-radius:16px;background:linear-gradient(155deg,#f7faff,#eef4ff);border:1px solid #dfe9ff}
.calc-out{font-size:12px;font-weight:600;color:var(--muted);line-height:1.4}
.calc-out strong{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.calc label{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.calc input{width:82px;height:38px;margin-top:6px;padding:0 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:14px;font-weight:700;outline:none;text-align:center;font-variant-numeric:tabular-nums}
.calc input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,95,255,.14)}
.calc-note{margin:10px 0 0;font-size:11.5px;color:#8a97a8;line-height:1.6}

.agent{display:flex;align-items:center;gap:14px;margin-top:24px;padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-xs)}
.avatar{width:50px;height:50px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#0b5fff);color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:0 4px 12px var(--brand-glow)}
.agent-info{flex:1;min-width:0}
.agent-info b{display:block;font-size:14.5px;font-weight:700;color:var(--ink)}
.agent-info span{font-size:12.5px;color:var(--muted);margin-top:2px;display:block}
.agent button{height:38px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;transition:background .16s ease,transform .16s ease}
.agent button:hover{background:#1c2f47;transform:translateY(-1px)}

.similar-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer;transition:all .18s ease}
.mini:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:#d4ddea}
.mini img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mini-body{padding:10px 12px 12px}
.mini-price{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.mini-specs{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:500}
.mini-addr{font-size:11.5px;color:#8a97a8;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:26px;z-index:1000;transform:translate(-50%,24px);display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:14px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 20px 44px rgba(10,22,40,.4);opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;stroke:#4ade80;fill:none;stroke-width:2.6;flex:0 0 auto}

/* ============================================================
   WHATSAPP & TRANSLATE WIDGETS
   ============================================================ */
.whatsapp-float {
  position: fixed;
  bottom: 96px;
  right: 22px;
  z-index: 960;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background-color: var(--whatsapp);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 32px rgba(37, 211, 102, 0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  animation: pulse-whatsapp 2s infinite;
}
.whatsapp-float:hover {
  transform: scale(1.08);
  box-shadow: 0 16px 40px rgba(37, 211, 102, 0.5);
}
.whatsapp-float svg {
  width: 32px;
  height: 32px;
  fill: currentColor;
}
@keyframes pulse-whatsapp {
  0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
  70% { box-shadow: 0 0 0 16px rgba(37, 211, 102, 0); }
  100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
}

.gtranslate_wrapper {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 940;
}
@media (max-width: 1000px) {
  .gtranslate_wrapper {
    bottom: 100px;
    left: 14px;
  }
}

/* ============================================================
   MOBILE BOTTOM NAV
   ============================================================ */
.bottom-nav{display:none;position:fixed;left:14px;right:88px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:700;padding:6px;background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:999px;box-shadow:0 14px 40px rgba(10,22,40,.2);border:1px solid rgba(255,255,255,.6);grid-template-columns:repeat(3,1fr);gap:4px}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px;border-radius:999px;font-size:10.5px;font-weight:700;color:var(--muted);transition:color .16s ease,background .16s ease;position:relative}
.bottom-nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.bottom-nav button.active{color:var(--brand)}
.bottom-nav button.active svg{stroke:var(--brand)}
.bottom-nav button .nav-count{position:absolute;top:4px;right:14px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px var(--brand-glow);transform:scale(0);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.bottom-nav button .nav-count.show{transform:scale(1)}

.view-toggle{display:none;position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:660;padding:5px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-radius:999px;box-shadow:0 14px 40px rgba(10,22,40,.22);border:1px solid rgba(255,255,255,.6);gap:2px}
.view-toggle button{padding:9px 22px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:background .16s ease,color .16s ease}
.view-toggle button.active{background:var(--ink);color:#fff}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1240px){
  .app{grid-template-columns:264px minmax(0,1fr) minmax(320px,40%)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
  .results{padding:0 24px 100px}
  .topbar{padding:0 20px;gap:14px}
}
@media (max-width:1000px){
  :root{--header-h:64px}
  .topbar{padding:0 14px;gap:10px;height:64px}
  .brand-mark{width:34px;height:34px;border-radius:10px}
  .brand-mark svg{width:18px;height:18px}
  .brand-name{font-size:18px}
  .brand-sub{font-size:8.5px;letter-spacing:.1em}
  .mode-toggle{padding:3px}
  .mode-toggle button{min-width:58px;padding:7px 12px;font-size:12.5px}
  .region-toggle button{padding:6px 8px;font-size:11.5px}
  .searchbar{display:none}
  .nav-link{display:none}
  .btn-filter{display:inline-flex;height:38px;padding:0 14px;font-size:12.5px;gap:6px}
  .btn-saved{height:38px;padding:0 12px;font-size:12.5px}
  .btn-saved .label{display:none}
  .btn-saved svg{width:15px;height:15px}
  .app{display:block;height:calc(100vh - 64px);overflow:hidden}
  .results{height:100%;padding:0 16px 130px}
  .results-head{padding:20px 0 16px;align-items:flex-start;flex-direction:column;gap:14px}
  .results-head h1{font-size:22px}
  .results-head .sub{font-size:12.5px;margin-top:4px}
  .sort-wrap{width:100%}
  .sort-wrap select{width:100%;height:42px;padding:0 34px;text-align:left}
  .grid{grid-template-columns:1fr;gap:18px}
  .card{border-radius:18px}
  .card-media{aspect-ratio:16/10}
  .card-price-overlay .price{font-size:24px}
  .card-price-overlay .price .suffix{font-size:14px}
  .card-body{padding:16px 16px 18px}
  .specs{font-size:14px}
  .addr{font-size:13.5px}
  .slideshow-dots{opacity:1}
  .slide-arrow{opacity:1;pointer-events:auto;width:32px;height:32px}
  .mapwrap{display:none;position:fixed;top:64px;left:0;right:0;bottom:0;z-index:400}
  body.show-map .results{display:none}
  body.show-map .mapwrap{display:block}
  .filters{position:fixed;top:auto;bottom:0;left:0;right:0;max-height:88vh;padding:8px 20px calc(120px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;border-right:0;box-shadow:0 -24px 60px rgba(10,22,40,.24);transform:translateY(100%);transition:transform .34s cubic-bezier(.22,.9,.3,1);z-index:960;overflow-y:auto;overscroll-behavior:contain}
  .filters.open{transform:translateY(0)}
  .filters::before{content:"";display:block;width:40px;height:4px;margin:10px auto 18px;border-radius:2px;background:#d9e1ea}
  .filters-head{padding-top:0;margin-bottom:20px}
  .filters-head h2{font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:800}
  .filter-section{padding:18px 0}
  .filter-section h3{font-size:14px;margin-bottom:14px}
  .chip{padding:10px 16px;font-size:14px}
  .range-slider{height:44px}
  .range-slider input[type=range]::-webkit-slider-thumb{width:26px;height:26px}
  .bottom-nav{display:grid}
  .view-toggle{display:flex}
  .drawer{width:100%;max-width:none;border-radius:0}
  .drawer-hero{aspect-ratio:5/4}
  .drawer-body{padding:22px 22px 120px}
  .drawer .price-lg{font-size:28px}
  .calc{grid-template-columns:1fr 1fr;gap:14px;padding:16px}
  .calc-out{grid-column:1/-1}
  .calc-out strong{font-size:24px}
  .calc input{width:100%}
  .facts-grid{grid-template-columns:1fr}
  .similar-grid{grid-template-columns:1fr}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px));font-size:13px;padding:12px 18px;max-width:calc(100vw - 32px)}
  
  .whatsapp-float { bottom: 90px; right: 16px; width: 50px; height: 50px; }
  .whatsapp-float svg { width: 26px; height: 26px; }
}
@media (max-width:400px){
  .brand-name{font-size:16px}
  .mode-toggle button{min-width:52px;padding:7px 10px;font-size:12px}
  .region-toggle button{padding:5px 6px;font-size:11px}
  .results-head h1{font-size:20px}
  .bottom-nav{right:80px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

</head>
<body>

<header class="topbar">
  <a class="brand" href="#" aria-label="CME Real Estate and Properties home">
    <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3.1 2.6 10.5a1 1 0 0 0 .62 1.79h1.3v7.7a1 1 0 0 0 1 1h4.3v-6.2h4.36v6.2h4.3a1 1 0 0 0 1-1v-7.7h1.3a1 1 0 0 0 .62-1.79z"/></svg></span>
    <span class="brand-text"><span class="brand-name">CME</span><span class="brand-sub">Real Estate &amp; Properties</span></span>
  </a>

  <div class="mode-toggle" data-mode="sale" role="group" aria-label="Buy or rent">
    <button type="button" data-mode="sale" class="active">Buy</button>
    <button type="button" data-mode="rent">Rent</button>
  </div>

  <div class="region-toggle" role="group" aria-label="Region">
    <button type="button" data-region="usa" class="active">USA</button>
    <button type="button" data-region="ecuador">Ecuador</button>
  </div>

  <form class="searchbar" id="searchForm" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="search" placeholder="City, ZIP code, or address" aria-label="Search homes" />
  </form>

  <div class="top-actions">
    <button class="btn-filter" id="filterBtn" aria-label="Open filters">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      Filters <span class="badge" id="filterBadge">0</span>
    </button>
    <a class="nav-link dim" href="#">Buy</a>
    <a class="nav-link dim" href="#">Rent</a>
    <a class="nav-link dim" href="#">Sell</a>
    <button class="btn-saved" id="savedBtn" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.4-4.6-9.2-8.9C1.4 8.1 3.5 4.8 6.9 4.8c2 0 3.5 1 4.4 2.3.9-1.3 2.4-2.3 4.4-2.3 3.4 0 5.5 3.3 4.1 6.8-1.8 4.3-9.2 8.9-9.2 8.9z"/></svg>
      <span class="label">Saved</span><span class="count" id="savedCount">0</span>
    </button>
  </div>
</header>

<main class="app">

  <aside class="filters" id="filters" aria-label="Filters">
    <div class="filters-head"><h2>Refine results</h2><button class="link-reset" id="resetBtn">Reset all</button></div>

    <section class="filter-section">
      <h3>Price range</h3>
      <div class="price-display"><span class="val" id="priceMinDisplay">$0</span><span class="val" id="priceMaxDisplay">$2M+</span></div>
      <div class="range-slider">
        <div class="range-track"><div class="range-fill" id="rangeFill"></div></div>
        <input type="range" id="priceMin" min="0" max="2000000" step="25000" value="0" aria-label="Minimum price">
        <input type="range" id="priceMax" min="0" max="2000000" step="25000" value="2000000" aria-label="Maximum price">
      </div>
    </section>

    <section class="filter-section">
      <h3>Beds</h3>
      <div class="chip-row" data-filter="beds">
        <button class="chip active" data-val="">Any</button>
        <button class="chip" data-val="1">1+</button><button class="chip" data-val="2">2+</button>
        <button class="chip" data-val="3">3+</button><button class="chip" data-val="4">4+</button><button class="chip" data-val="5">5+</button>
      </div>
    </section>

    <section class="filter-section">
      <h3>Baths</h3>
      <div class="chip-row" data-filter="baths">
        <button class="chip active" data-val="">Any</button>
        <button class="chip" data-val="1">1+</button><button class="chip" data-val="2">2+</button>
        <button class="chip" data-val="3">3+</button><button class="chip" data-val="4">4+</button>
      </div>
    </section>

    <section class="filter-section">
      <h3>Home type</h3>
      <div class="chip-row" data-filter="type">
        <button class="chip active" data-val="">All</button>
        <button class="chip" data-val="SINGLE_FAMILY">Single family</button>
        <button class="chip" data-val="CONDO">Condo</button>
        <button class="chip" data-val="TOWNHOUSE">Townhouse</button>
      </div>
    </section>

    <section class="filter-section" id="statusSection">
      <h3>Status</h3>
      <div class="chip-row" data-filter="status">
        <button class="chip active" data-val="FOR_SALE">For sale</button>
        <button class="chip" data-val="PENDING">Pending</button>
        <button class="chip" data-val="SOLD">Sold</button>
      </div>
    </section>

    <div class="side-card">
      <h3>Get price alerts</h3>
      <p>Be first to know when a matching home hits the market in your favorite neighborhood.</p>
      <button id="alertBtn">Create alert</button>
    </div>
  </aside>

  <section class="results" id="resultsPane">
    <div class="results-head">
      <div><h1 id="resultsTitle">Homes for sale</h1><div class="sub" id="resultsSub">Loading listings…</div></div>
      <div class="sort-wrap">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
        <select id="sortSelect" aria-label="Sort results">
          <option value="newest">Newest first</option><option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option><option value="sqft_desc">Largest first</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more-wrap"><button class="more" id="moreBtn" hidden>Show more homes</button></div>
  </section>

  <section class="mapwrap"><div id="map"></div></section>
</main>

<nav class="bottom-nav" aria-label="Quick actions">

  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const fmtUSD = n => n == null ? '—' : new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 }).format(n);
  const fmtNum = n => n == null ? '—' : new Intl.NumberFormat('en-US').format(n);

  function shortPrice(n) {
    if (n == null) return '—';
    if (n >= 1000000) return '$' + (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return '$' + Math.round(n / 1000) + 'K';
    return '$' + n;
  }
  function timeAgo(ts) {
    const d = Math.floor((Date.now() - ts) / 86400000);
    if (d <= 0) return 'today';
    if (d === 1) return '1 day ago';
    if (d < 30) return d + ' days ago';
    const m = Math.floor(d / 30);
    return m === 1 ? '1 month ago' : m + ' months ago';
  }
  function monthlyPayment(price, downPct, ratePct) {
    const principal = price * (1 - downPct / 100);
    const r = ratePct / 100 / 12;
    const n = 360;
    if (r <= 0) return principal / n;
    return (principal * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  }
  function debounce(fn, ms) { let t; return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); }; }
  function initials(name) { return (name || 'CME').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(); }

  const TYPE_LABEL = { SINGLE_FAMILY:'Single family', CONDO:'Condo', TOWNHOUSE:'Townhouse', MULTI_FAMILY:'Multi-family' };
  const STATUS_LABEL = { FOR_SALE:'For sale', FOR_RENT:'For rent', PENDING:'Pending', SOLD:'Sold' };

  function currentData() {
    if (state.region === 'ecuador') return state.mode === 'sale' ? ECU_LISTINGS : ECU_RENTALS;
    return state.mode === 'sale' ? USA_LISTINGS : USA_RENTALS;
  }
  function priceOf(l) { return state.mode === 'sale' ? (l.price || 0) : (l.rent || 0); }
  function maxPriceForMode() { return state.mode === 'sale' ? 2000000 : 6000; }
  function minPriceForMode() { return state.mode === 'sale' ? 0 : 200; }

  /* ------------------------------------------------------------------
     MAPBOX
     ------------------------------------------------------------------ */
  let map = null;
  const markers = [];

  function initMap() {
    if (!CONFIG.MAPBOX_TOKEN || CONFIG.MAPBOX_TOKEN.includes('...')) return;
    mapboxgl.accessToken = CONFIG.MAPBOX_TOKEN;
    map = new mapboxgl.Map({
      container: 'map', style: 'mapbox://styles/mapbox/streets-v12',
      center: [-97.74, 30.27], zoom: 4
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');
  }

  function renderMapMarkers(list) {
    if (!map) return;
    markers.forEach(m => m.remove());
    markers.length = 0;
    const bounds = new mapboxgl.LngLatBounds();
    let hasCoords = false;

    list.forEach(l => {
      if (l.lat == null || l.lng == null) return;
      const el = document.createElement('div');
      el.className = 'pin ' + (state.mode === 'sale' ? 'sale' : 'rent');
      const label = state.mode === 'sale' ? shortPrice(l.price) : '$' + fmtNum(l.rent) + '/mo';
      el.innerHTML = '<span>' + esc(label) + '</span>';
      el.addEventListener('click', () => openDetail(l.id));

      const marker = new mapboxgl.Marker({ element: el, anchor: 'bottom' }).setLngLat([l.lng, l.lat]).addTo(map);
      markers.push(marker);
      bounds.extend([l.lng, l.lat]);
      hasCoords = true;
    });

    if (hasCoords && list.length > 1) {
      map.fitBounds(bounds, { padding: 80, maxZoom: 13, duration: 800 });
    } else if (hasCoords) {
      map.flyTo({ center: bounds.getCenter(), zoom: 13 });
    }
  }

  /* ------------------------------------------------------------------
     RENDER
     ------------------------------------------------------------------ */
  let currentResults = [];

  function render() {
    currentResults = filtered();
    renderHead(); renderGrid(); renderMapMarkers(currentResults);
    syncSavedUI(); updateModeUI(); updateFilterBadge();
  }

  function filtered() {
    const q = state.q.trim().toLowerCase();
    let out = currentData().filter(l => {
      if (q) {
        const hay = (l.address + ' ' + l.city + ' ' + l.state + ' ' + l.zip).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      const p = priceOf(l);
      if (state.min > minPriceForMode() && p < state.min) return false;
      if (state.max < maxPriceForMode() && p > state.max) return false;
      if (state.beds && l.beds < +state.beds) return false;
      if (state.baths && l.baths < +state.baths) return false;
      if (state.type && l.type !== state.type) return false;
      if (state.status && state.mode === 'sale' && l.status !== state.status) return false;
      if (state.savedOnly && !saved.has(l.id)) return false;
      return true;
    });

    switch (state.sort) {
      case 'price_asc': out.sort((a, b) => priceOf(a) - priceOf(b)); break;
      case 'price_desc': out.sort((a, b) => priceOf(b) - priceOf(a)); break;
      case 'sqft_desc': out.sort((a, b) => b.sqft - a.sqft); break;
      default: out.sort((a, b) => b.listedAt - a.listedAt);
    }
    return out;
  }

  function renderHead() {
    const title = $('#resultsTitle'), sub = $('#resultsSub'), total = currentResults.length;
    if (state.savedOnly) {
      title.textContent = 'Saved homes';
      sub.innerHTML = total === 0 ? 'Tap the heart on any listing to save it here.' : '<b>' + total + '</b> ' + (total === 1 ? 'home' : 'homes') + ' in your collection';
      return;
    }
    if (state.mode === 'sale') {
      const label = state.status ? STATUS_LABEL[state.status] : 'Homes';
      title.textContent = label === 'For sale' ? 'Homes for sale' : label + ' homes';
    } else {
      title.textContent = 'Homes for rent';
    }
    const suffix = state.q ? ' matching “' + state.q + '”' : ' available right now';
    sub.innerHTML = '<b>' + total + '</b> ' + (total === 1 ? 'listing' : 'listings') + esc(suffix);
  }

  function cardHTML(l, index) {
    const isSaved = saved.has(l.id);
    const isRent = state.mode === 'rent';
    const isNew = Date.now() - l.listedAt < 7 * 86400000;

    const priceDisplay = isRent ? '$' + fmtNum(l.rent) : fmtUSD(l.price);
    const suffix = isRent ? '<span class="suffix">/mo</span>' : '';
    const estDisplay = isRent ? 'Per month' : fmtUSD(Math.round(monthlyPayment(l.price, 20, 6.5))) + '/mo';
    const badgeClass = isRent ? 'for_rent' : 'for_sale';
    const badgeLabel = isRent ? 'For rent' : STATUS_LABEL[l.status];
    const metaLeft = isRent ? (l.leaseTerm || '12 mo lease') : (TYPE_LABEL[l.type] || l.subtype);
    const metaRight = isRent ? 'Listed ' + timeAgo(l.listedAt) : timeAgo(l.listedAt);

    const photos = l.photos || [];
    const slides = photos.map((src, i) =>
      `<img src="${esc(src)}" alt="${esc(l.address)} photo ${i + 1}" loading="lazy" class="${i === 0 ? 'active' : ''}">`
    ).join('');

    const dots = photos.map((_, i) => `<span class="${i === 0 ? 'active' : ''}" data-slide="${i}"></span>`).join('');

    return `
      <article class="card" data-id="${l.id}" data-slide-index="0" tabindex="0" aria-label="${esc(l.address + ', ' + l.city)} — ${priceDisplay}" style="animation-delay:${index * 40}ms">
        <div class="card-media">
          ${slides}
          <div class="card-badges">
            <span class="badge badge--${badgeClass}">${esc(badgeLabel)}</span>
            ${isNew ? '<span class="badge badge--new">New</span>' : ''}
          </div>
          <button class="card-heart${isSaved ? ' on' : ''}" data-fav="${l.id}" aria-label="${isSaved ? 'Remove from saved' : 'Save home'}">
            <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.4-4.6-9.2-8.9C1.4 8.1 3.5 4.8 6.9 4.8c2 0 3.5 1 4.4 2.3.9-1.3 2.4-2.3 4.4-2.3 3.4 0 5.5 3.3 4.1 6.8-1.8 4.3-9.2 8.9-9.2 8.9z"/></svg>
          </button>
          <button class="slide-arrow prev" data-slide-prev aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="slide-arrow next" data-slide-next aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
          <div class="slideshow-dots">${dots}</div>
          <div class="card-price-overlay">
            <span class="price">${priceDisplay}${suffix}</span>
            <span class="est">${estDisplay}</span>
          </div>
        </div>
        <div class="card-body">
          <div class="specs">
            <span>${l.beds === 0 ? 'Studio' : l.beds + ' bd'}</span><span class="dot"></span>
            <span>${l.baths} ba</span><span class="dot"></span>
            <span>${fmtNum(l.sqft)} sqft</span>
          </div>
          <div class="addr">${esc(l.address)}, ${esc(l.city)}, ${esc(l.state)} ${esc(l.zip)}</div>
          <div class="meta-row">
            <span class="meta-tag"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>${esc(metaLeft)}</span>
            <span>${metaRight}</span>
          </div>
        </div>
      </article>`;
  }

  function emptyHTML() {
    if (state.savedOnly) {
      return `<div class="empty"><div class="empty-ico"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.4-4.6-9.2-8.9C1.4 8.1 3.5 4.8 6.9 4.8c2 0 3.5 1 4.4 2.3.9-1.3 2.4-2.3 4.4-2.3 3.4 0 5.5 3.3 4.1 6.8-1.8 4.3-9.2 8.9-9.2 8.9z"/></svg></div><h3>No saved homes yet</h3><p>Tap the heart icon on any listing and it will show up here.</p></div>`;
    }
    return `<div class="empty"><div class="empty-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div><h3>No homes match those filters</h3><p>Try widening your price range or searching a nearby city.</p></div>`;
  }

  function renderGrid() {
    const grid = $('#grid'), visible = currentResults.slice(0, state.shown);
    grid.innerHTML = visible.length ? visible.map(cardHTML).join('') : emptyHTML();
    $('#moreBtn').hidden = state.savedOnly || visible.length >= currentResults.length;
    bindSlideshows();
  }

  function bindSlideshows() {
    $$('.card').forEach(card => {
      const imgs = $$('img', card);
      const dots = $$('.slideshow-dots span', card);
      let idx = 0;
      function show(i) {
        idx = (i + imgs.length) % imgs.length;
        imgs.forEach((img, j) => img.classList.toggle('active', j === idx));
        dots.forEach((d, j) => d.classList.toggle('active', j === idx));
      }
      const next = $('[data-slide-next]', card), prev = $('[data-slide-prev]', card);
      if (next) next.addEventListener('click', e => { e.stopPropagation(); show(idx + 1); });
      if (prev) prev.addEventListener('click', e => { e.stopPropagation(); show(idx - 1); });
      dots.forEach((dot, i) => dot.addEventListener('click', e => { e.stopPropagation(); show(i); }));
      let hoverTimer;
      card.addEventListener('mouseenter', () => { if (imgs.length > 1) hoverTimer = setInterval(() => show(idx + 1), 3200); });
      card.addEventListener('mouseleave', () => clearInterval(hoverTimer));
    });
  }

  function syncSavedUI() {
    $('#savedCount').textContent = saved.size;
    const nav = $('#navSavedCount');
    if (nav) { nav.textContent = saved.size; nav.classList.toggle('show', saved.size > 0); }
    const btn = $('#savedBtn');
    btn.classList.toggle('active', state.savedOnly);
    btn.setAttribute('aria-pressed', state.savedOnly);
    const navSaved = $('#navSaved');
    if (navSaved) navSaved.classList.toggle('active', state.savedOnly);
  }

  function toggleSaved(id) {
    const wasSaved = saved.has(id);
    if (wasSaved) saved.delete(id); else saved.add(id);
    persistSaved();
    $$('[data-fav="' + id + '"]').forEach(el => {
      el.classList.toggle('on', !wasSaved);
      el.setAttribute('aria-label', wasSaved ? 'Save home' : 'Remove from saved');
    });
    syncSavedUI();
    if (state.savedOnly) render();
    toast(wasSaved ? 'Removed from saved' : 'Saved to your homes');
  }

  function updateFilterBadge() {
    let count = 0;
    if (state.min > minPriceForMode() || state.max < maxPriceForMode()) count++;
    if (state.beds) count++;
    if (state.baths) count++;
    if (state.type) count++;
    if (state.mode === 'sale' && state.status && state.status !== 'FOR_SALE') count++;
    const badge = $('#filterBadge'), nav = $('#navFilterCount');
    if (badge) { badge.textContent = count; badge.classList.toggle('show', count > 0); }
    if (nav) { nav.textContent = count; nav.classList.toggle('show', count > 0); }
  }

  /* ------------------------------------------------------------------
     DRAWER
     ------------------------------------------------------------------ */
  const drawer = $('#drawer'), scrim = $('#scrim');
  let activeDetailId = null, heroIndex = 0;

  function factRow(label, value) {
    if (value == null || value === '' || value === 0) return '';
    return `<div class="fact"><span>${esc(label)}</span><b>${value}</b></div>`;
  }

  function detailHTML(l) {
    const isSaved = saved.has(l.id);
    const isRent = state.mode === 'rent';
    const priceDisplay = isRent ? '$' + fmtNum(l.rent) + '/mo' : fmtUSD(l.price);
    const est = isRent ? null : Math.round(monthlyPayment(l.price, 20, 6.5));
    const badgeLabel = isRent ? 'For rent' : STATUS_LABEL[l.status];
    const badgeClass = isRent ? 'rent' : 'brand';
    const photos = l.photos || [];

    const heroSlides = photos.map((src, i) =>
      `<img src="${esc(src)}" alt="${esc(l.address)} photo ${i + 1}" class="${i === 0 ? 'active' : ''}">`
    ).join('');

    const dots = photos.map((_, i) => `<span class="${i === 0 ? 'active' : ''}" data-hero-slide="${i}"></span>`).join('');

    const facts = [
      factRow('Price / sqft', l.pricePerSqft ? '$' + l.pricePerSqft : null),
      factRow('Zestimate', l.zestimate ? fmtUSD(l.zestimate) : null),
      factRow('HOA', l.hoa ? '$' + fmtNum(l.hoa) + '/mo' : null),
      factRow('Year built', l.year),
      factRow('Lot size', l.lot ? fmtNum(l.lot) + ' sqft' : null),
      factRow('Property subtype', l.subtype ? esc(l.subtype) : null),
      isRent ? factRow('Lease term', l.leaseTerm) : ''
    ].filter(Boolean).join('');

    return `
      <div class="drawer-hero">
        ${heroSlides}
        <button class="close-btn" id="closeDrawer" aria-label="Close details"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button class="hero-arrow prev" data-hero-prev aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="hero-arrow next" data-hero-next aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <div class="hero-dots">${dots}</div>
      </div>
      <div class="drawer-body">
        <div class="drow">
          <div>
            <div class="price-lg">${priceDisplay}</div>
            <div class="specs-lg">
              <span>${l.beds === 0 ? 'Studio' : l.beds + ' beds'}</span><span class="dot"></span>
              <span>${l.baths} baths</span><span class="dot"></span>
              <span>${fmtNum(l.sqft)} sqft</span>
            </div>
            <div class="addr-lg">${esc(l.address)}, ${esc(l.city)}, ${esc(l.state)} ${esc(l.zip)}</div>
          </div>
          <button class="heart-lg${isSaved ? ' on' : ''}" data-fav="${l.id}" aria-label="${isSaved ? 'Remove from saved' : 'Save home'}">
            <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.4-4.6-9.2-8.9C1.4 8.1 3.5 4.8 6.9 4.8c2 0 3.5 1 4.4 2.3.9-1.3 2.4-2.3 4.4-2.3 3.4 0 5.5 3.3 4.1 6.8-1.8 4.3-9.2 8.9-9.2 8.9z"/></svg>
          </button>
        </div>
        <div class="pillrow">
          <span class="pill ${badgeClass}">${esc(badgeLabel)}</span>
          <span class="pill">${esc(TYPE_LABEL[l.type] || l.subtype || 'Home')}</span>
          ${l.year ? '<span class="pill">Built ' + l.year + '</span>' : ''}
          ${l.lot ? '<span class="pill">' + fmtNum(l.lot) + ' sqft lot</span>' : ''}
          <span class="pill">Listed ${timeAgo(l.listedAt)}</span>
        </div>
        ${facts ? '<h3 class="section-title">Facts &amp; features</h3><div class="facts-grid">' + facts + '</div>' : ''}
        <h3 class="section-title">About this home</h3><p class="desc">${esc(l.description)}</p>
        ${isRent ? '' : `
          <h3 class="section-title">Estimated monthly payment</h3>
          <div class="calc">
            <div class="calc-out"><strong id="calcOut">${fmtUSD(est)}</strong>principal &amp; interest</div>
            <label>Down<input id="calcDown" type="number" min="0" max="90" step="5" value="20">%</label>
            <label>Rate<input id="calcRate" type="number" min="0" max="15" step="0.1" value="6.5">%</label>
          </div>
          <p class="calc-note">Based on a 30-year fixed-rate loan. Taxes, insurance, and HOA dues are not included.</p>
        `}
        <div class="agent">
          <div class="avatar">${esc(initials(l.agent.name))}</div>
          <div class="agent-info"><b>${esc(l.agent.name)}</b><span>${esc(l.agent.title)}</span></div>
          <button type="button" data-contact>Contact</button>
        </div>
        <h3 class="section-title">Similar homes nearby</h3>
        <div class="similar-grid" id="similarGrid"></div>
      </div>`;
  }

  function similarFor(l) {
    const p = priceOf(l);
    const lo = p * 0.55, hi = p * 1.45;
    return currentData().filter(x => x.id !== l.id && x.city === l.city && priceOf(x) >= lo && priceOf(x) <= hi)
      .sort((a, b) => Math.abs(priceOf(a) - p) - Math.abs(priceOf(b) - p)).slice(0, 4);
  }

  function renderSimilar(l) {
    const grid = $('#similarGrid'); if (!grid) return;
    const items = similarFor(l);
    if (!items.length) { grid.innerHTML = '<div style="grid-column:1/-1;font-size:13px;color:#8a97a8">No similar homes found nearby.</div>'; return; }
    grid.innerHTML = items.map(x => {
      const isR = state.mode === 'rent';
      const p = isR ? '$' + fmtNum(x.rent) + '/mo' : fmtUSD(x.price);
      const photo = (x.photos && x.photos[0]) || '';
      return `<div class="mini" data-id="${x.id}" role="button" tabindex="0">
        <img src="${esc(photo)}" alt="${esc(x.address)}" loading="lazy">
        <div class="mini-body"><div class="mini-price">${p}</div>
        <div class="mini-specs">${x.beds === 0 ? 'Studio' : x.beds + ' bd'} · ${x.baths} ba · ${fmtNum(x.sqft)} sqft</div>
        <div class="mini-addr">${esc(x.address)}</div></div>
      </div>`;
    }).join('');
  }

  function bindHeroSlideshow() {
    const imgs = $$('.drawer-hero img'), dots = $$('.hero-dots span');
    heroIndex = 0;
    function show(i) {
      heroIndex = (i + imgs.length) % imgs.length;
      imgs.forEach((img, j) => img.classList.toggle('active', j === heroIndex));
      dots.forEach((d, j) => d.classList.toggle('active', j === heroIndex));
    }
    const next = $('[data-hero-next]'), prev = $('[data-hero-prev]');
    if (next) next.addEventListener('click', e => { e.stopPropagation(); show(heroIndex + 1); });
    if (prev) prev.addEventListener('click', e => { e.stopPropagation(); show(heroIndex - 1); });
    dots.forEach((dot, i) => dot.addEventListener('click', e => { e.stopPropagation(); show(i); }));
  }

  function openDetail(id) {
    const listing = currentData().find(x => x.id === id);
    if (!listing) return;
    activeDetailId = id;
    drawer.innerHTML = detailHTML(listing);
    drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); drawer.scrollTop = 0;
    scrim.classList.add('show');
    if (state.mode === 'sale') bindCalculator(listing.price);
    renderSimilar(listing); bindHeroSlideshow();
    const closeBtn = $('#closeDrawer'); if (closeBtn) closeBtn.focus({ preventScroll: true });
  }

  function closeDrawer() {
    activeDetailId = null;
    drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); scrim.classList.remove('show');
  }

  function bindCalculator(price) {
    const out = $('#calcOut'), down = $('#calcDown'), rate = $('#calcRate');
    if (!out || !down || !rate) return;
    const update = () => {
      const d = Math.min(Math.max(parseFloat(down.value) || 0, 0), 90);
      const r = Math.min(Math.max(parseFloat(rate.value) || 0, 0), 15);
      out.textContent = fmtUSD(Math.round(monthlyPayment(price, d, r)));
    };
    down.addEventListener('input', update); rate.addEventListener('input', update);
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast'); $('#toastMsg').textContent = msg;
    el.classList.add('show'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  const filtersPanel = $('#filters');
  function openFilters() { filtersPanel.classList.add('open'); scrim.classList.add('show'); }
  function closeFilters() { filtersPanel.classList.remove('open'); if (!drawer.classList.contains('open')) scrim.classList.remove('show'); }

  function updateModeUI() {
    const isRent = state.mode === 'rent';
    $('#statusSection').style.display = isRent ? 'none' : '';
    if (isRent) state.status = '';

    const minSlider = $('#priceMin'), maxSlider = $('#priceMax');
    minSlider.min = minPriceForMode(); maxSlider.min = minPriceForMode();
    minSlider.max = maxPriceForMode(); maxSlider.max = maxPriceForMode();
    minSlider.step = isRent ? 50 : 25000; maxSlider.step = isRent ? 50 : 25000;
    minSlider.value = minPriceForMode(); maxSlider.value = maxPriceForMode();
    state.min = minPriceForMode(); state.max = maxPriceForMode();
    updatePriceDisplay();

    const toggle = document.querySelector('.mode-toggle');
    toggle.dataset.mode = isRent ? 'rent' : 'sale';
    $$('.mode-toggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
    $('#searchInput').placeholder = isRent ? 'City, ZIP, or address (rentals)' : 'City, ZIP code, or address';
  }

  function updatePriceDisplay() {
    const isRent = state.mode === 'rent';
    const min = +$('#priceMin').value, max = +$('#priceMax').value;
    $('#priceMinDisplay').textContent = isRent ? '$' + fmtNum(min) : (min === 0 ? '$0' : shortPrice(min));
    $('#priceMaxDisplay').textContent = isRent
      ? (max >= maxPriceForMode() ? '$' + fmtNum(maxPriceForMode()) + '+' : '$' + fmtNum(max))
      : (max >= maxPriceForMode() ? '$2M+' : shortPrice(max));
    const minPct = ((min - minPriceForMode()) / (maxPriceForMode() - minPriceForMode())) * 100;
    const maxPct = ((max - minPriceForMode()) / (maxPriceForMode() - minPriceForMode())) * 100;
    $('#rangeFill').style.left = minPct + '%'; $('#rangeFill').style.right = (100 - maxPct) + '%';
  }

  function bindEvents() {
    $$('.mode-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.mode === btn.dataset.mode) return;
        state.mode = btn.dataset.mode; state.savedOnly = false;
        state.q = ''; $('#searchInput').value = '';
        state.beds = ''; state.baths = ''; state.type = '';
        state.status = state.mode === 'sale' ? 'FOR_SALE' : '';
        $$('.chip-row').forEach(row => { $$('.chip', row).forEach(c => c.classList.toggle('active', c.dataset.val === (row.dataset.filter === 'status' ? 'FOR_SALE' : ''))); });
        updateModeUI(); render();
      });
    });

    $$('.region-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.region === btn.dataset.region) return;
        state.region = btn.dataset.region; state.savedOnly = false;
        $$('.region-toggle button').forEach(b => b.classList.toggle('active', b.dataset.region === state.region));
        state.shown = state.pageSize;
        render();
      });
    });

    const minSlider = $('#priceMin'), maxSlider = $('#priceMax');
    function onSliderInput(which) {
      let min = +minSlider.value, max = +maxSlider.value;
      const step = state.mode === 'sale' ? 25000 : 50;
      if (min > max - step) { if (which === 'min') minSlider.value = max - step; else maxSlider.value = min + step; }
      min = +minSlider.value; max = +maxSlider.value;
      state.min = min; state.max = max;
      updatePriceDisplay(); updateFilterBadge(); render();
    }
    minSlider.addEventListener('input', () => onSliderInput('min'));
    maxSlider.addEventListener('input', () => onSliderInput('max'));

    $$('.chip-row').forEach(row => {
      row.addEventListener('click', e => {
        const chip = e.target.closest('.chip'); if (!chip) return;
        $$('.chip', row).forEach(c => c.classList.remove('active')); chip.classList.add('active');
        state[row.dataset.filter] = chip.dataset.val; state.savedOnly = false; render();
      });
    });

    $('#searchForm').addEventListener('submit', e => { e.preventDefault(); state.q = $('#searchInput').value; state.savedOnly = false; render(); $('#resultsPane').scrollTop = 0; });
    $('#searchInput').addEventListener('input', debounce(function () { const v = this.value; if (v === state.q) return; state.q = v; state.savedOnly = false; render(); }, 320));

    $('#savedBtn').addEventListener('click', () => { state.savedOnly = !state.savedOnly; render(); if (window.innerWidth <= 1000) document.body.classList.remove('show-map'); });
    $('#navSaved').addEventListener('click', () => { state.savedOnly = !state.savedOnly; render(); document.body.classList.remove('show-map'); $$('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === 'list')); $('#navMap').classList.remove('active'); });
    $('#sortSelect').addEventListener('change', e => { state.sort = e.target.value; render(); });

    $('#resetBtn').addEventListener('click', () => {
      state.q = ''; $('#searchInput').value = '';
      state.beds = ''; state.baths = ''; state.type = ''; state.status = state.mode === 'sale' ? 'FOR_SALE' : '';
      state.savedOnly = false; state.sort = 'newest'; $('#sortSelect').value = 'newest';
      $$('.chip-row').forEach(row => { $$('.chip', row).forEach(c => c.classList.toggle('active', c.dataset.val === (row.dataset.filter === 'status' ? 'FOR_SALE' : ''))); });
      minSlider.value = minPriceForMode(); maxSlider.value = maxPriceForMode();
      state.min = minPriceForMode(); state.max = maxPriceForMode();
      updatePriceDisplay(); render(); toast('Filters cleared');
    });

    $('#moreBtn').addEventListener('click', () => { state.shown += state.pageSize; renderGrid(); });
    $('#filterBtn').addEventListener('click', openFilters); $('#navFilters').addEventListener('click', openFilters);

    $$('.view-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.view-toggle button').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        const showMap = btn.dataset.view === 'map';
        document.body.classList.toggle('show-map', showMap); $('#navMap').classList.toggle('active', showMap);
        if (showMap && map) setTimeout(() => map.resize(), 60);
      });
    });
    $('#navMap').addEventListener('click', () => {
      const isMap = document.body.classList.toggle('show-map');
      $('#navMap').classList.toggle('active', isMap);
      $$('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === (isMap ? 'map' : 'list')));
      if (isMap && map) setTimeout(() => map.resize(), 60);
    });

    scrim.addEventListener('click', () => { if (drawer.classList.contains('open')) closeDrawer(); else closeFilters(); });

    document.addEventListener('click', e => {
      if (e.target.closest('#closeDrawer')) { closeDrawer(); return; }
      const favBtn = e.target.closest('[data-fav]');
      if (favBtn) { e.preventDefault(); e.stopPropagation(); toggleSaved(favBtn.dataset.fav); return; }
      if (e.target.closest('[data-contact]')) { toast('An agent will reach out shortly'); return; }
      if (e.target.closest('#alertBtn')) { toast('Price alert created for this search'); return; }
      const target = e.target.closest('.card[data-id], .mini[data-id]');
      if (target) openDetail(target.dataset.id);
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (drawer.classList.contains('open')) { closeDrawer(); return; }
        if (filtersPanel.classList.contains('open')) { closeFilters(); return; }
        return;
      }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-id], .mini[data-id]')) { e.preventDefault(); openDetail(e.target.dataset.id); }
    });

    window.addEventListener('resize', debounce(() => { if (map) map.resize(); }, 180));
  }

  function boot() { initMap(); bindEvents(); updateModeUI(); render(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
