<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NestView — Find your next home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --ink:#0d1b2a;
  --ink-2:#33465c;
  --muted:#6b7a8d;
  --line:#e6eaf0;
  --line-2:#eef1f6;
  --bg:#f6f8fb;
  --card:#ffffff;
  --brand:#0b5fff;
  --brand-dark:#0849cc;
  --brand-soft:#e8f0ff;
  --green:#0e9f6e;
  --radius:16px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(13,27,42,.05), 0 1px 3px rgba(13,27,42,.05);
  --shadow-md:0 10px 30px rgba(13,27,42,.12);
  --shadow-lg:0 24px 60px rgba(13,27,42,.20);
  --header-h:72px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--brand);color:#fff}

.results::-webkit-scrollbar,.drawer::-webkit-scrollbar,.filters::-webkit-scrollbar,
.chat-messages::-webkit-scrollbar{width:10px}
.results::-webkit-scrollbar-thumb,.drawer::-webkit-scrollbar-thumb,
.filters::-webkit-scrollbar-thumb,.chat-messages::-webkit-scrollbar-thumb{
  background:#d3dae3;border-radius:99px;border:3px solid transparent;background-clip:content-box;
}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:800;
  height:var(--header-h);
  display:flex;align-items:center;gap:18px;
  padding:0 22px;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-size:21px;font-weight:800;letter-spacing:-.035em;
  white-space:nowrap;flex:0 0 auto;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,#2f7bff,#0b5fff 55%,#0640b5);
  box-shadow:0 4px 12px rgba(11,95,255,.32);
}
.brand-mark svg{width:19px;height:19px;fill:#fff}
.brand em{font-style:normal;color:var(--brand)}

.searchbar{position:relative;flex:1 1 auto;max-width:560px;min-width:0}
.searchbar svg{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:#8a97a8;fill:none;stroke-width:2;pointer-events:none;
}
.searchbar input{
  width:100%;height:44px;padding:0 18px 0 44px;
  border:1px solid transparent;border-radius:999px;
  background:#f1f4f8;font-size:15px;font-weight:500;outline:none;
  transition:background .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.searchbar input::placeholder{color:#8a97a8;font-weight:500}
.searchbar input:focus{
  background:#fff;border-color:var(--brand);
  box-shadow:0 0 0 4px rgba(11,95,255,.13);
}

.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.nav-link{
  padding:9px 13px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);
}
.nav-link:hover{background:#f1f4f8;color:var(--ink)}
.nav-link.dim{color:var(--muted)}

.btn-saved{
  display:inline-flex;align-items:center;gap:8px;
  height:40px;padding:0 15px;border-radius:999px;
  border:1px solid var(--line);background:#fff;
  font-size:14px;font-weight:600;
  transition:border-color .16s ease,background .16s ease,color .16s ease;
}
.btn-saved svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;color:#96a3b3}
.btn-saved:hover{border-color:#cfd8e3;background:#fbfcfe}
.btn-saved.active{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-saved.active svg{fill:#fff;stroke:#fff;color:#fff}
.btn-saved .count{
  min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  display:inline-grid;place-items:center;font-size:12px;font-weight:700;
  background:#eef1f6;color:var(--ink-2);
}
.btn-saved.active .count{background:rgba(255,255,255,.25);color:#fff}

.btn-filter{
  display:none;align-items:center;gap:7px;
  height:40px;padding:0 15px;border-radius:999px;
  border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;
}
.btn-filter svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ============================================================
   APP LAYOUT
   ============================================================ */
.app{
  display:grid;
  grid-template-columns:270px minmax(0,1fr) minmax(340px,44%);
  height:calc(100vh - var(--header-h));
}

.filters{
  padding:22px 18px 40px;
  background:#fff;
  border-right:1px solid var(--line);
  overflow-y:auto;
}
.filters-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.filters-head h2{
  margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
}
.link-reset{
  font-size:13px;font-weight:600;color:var(--brand);
  padding:4px 6px;border-radius:6px;
}
.link-reset:hover{background:var(--brand-soft)}

.field{display:block;margin-bottom:16px}
.field > span{
  display:block;margin-bottom:7px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);
}
.select-wrap{position:relative}
.select-wrap::after{
  content:"";position:absolute;right:13px;top:50%;
  width:8px;height:8px;margin-top:-5px;
  border-right:2px solid #8a97a8;border-bottom:2px solid #8a97a8;
  transform:rotate(45deg);pointer-events:none;
}
.field select{
  width:100%;height:42px;padding:0 34px 0 13px;
  border:1px solid var(--line);border-radius:var(--radius-sm);
  background:#fff;font-size:14px;font-weight:500;outline:none;
  appearance:none;-webkit-appearance:none;
}
.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,95,255,.12)}

.side-card{
  margin-top:22px;padding:16px;border-radius:var(--radius);
  background:linear-gradient(160deg,#f4f8ff,#eef4ff);
  border:1px solid #dde9ff;
}
.side-card h3{margin:0 0 4px;font-size:14px;font-weight:700}
.side-card p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.side-card button{
  width:100%;height:38px;border-radius:9px;background:var(--brand);color:#fff;
  font-size:13.5px;font-weight:600;
}

.results{overflow-y:auto;padding:0 24px 70px;scroll-behavior:smooth}
.results-head{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 0 16px;margin-bottom:4px;
  background:linear-gradient(to bottom,var(--bg) 72%,rgba(246,248,251,0));
}
.results-head h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.results-head .sub{margin-top:2px;font-size:12.5px;color:var(--muted);font-weight:500}
.sort-wrap{position:relative;flex:0 0 auto}
.sort-wrap::after{
  content:"";position:absolute;right:12px;top:50%;
  width:7px;height:7px;margin-top:-4px;
  border-right:2px solid #8a97a8;border-bottom:2px solid #8a97a8;
  transform:rotate(45deg);pointer-events:none;
}
.sort-wrap select{
  height:38px;padding:0 30px 0 13px;border-radius:999px;
  border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;
  outline:none;appearance:none;-webkit-appearance:none;cursor:pointer;
}

.grid{
  display:grid;gap:20px;
  grid-template-columns:repeat(auto-fill,minmax(262px,1fr));
}

.card{
  position:relative;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.card-media{position:relative;aspect-ratio:4/3;background:#eef1f5;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .card-media img{transform:scale(1.045)}

.badge{
  position:absolute;top:10px;left:10px;
  padding:4px 9px;border-radius:7px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.95);
  box-shadow:0 1px 3px rgba(13,27,42,.16);
}
.badge--for_sale{color:#0a4fd6}
.badge--pending{color:#8a5300;background:#fff4dd}
.badge--sold{color:#4a5768;background:#eef1f6}

.heart{
  position:absolute;bottom:10px;right:10px;
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(13,27,42,.18);
  transition:transform .16s ease;
  z-index:2;
}
.heart svg{width:18px;height:18px;stroke:#5d6b7d;fill:transparent;stroke-width:1.9}
.heart:hover svg{stroke:#e8453c}
.heart.on svg{fill:#e8453c;stroke:#e8453c}
.heart.on{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

.card-body{padding:13px 15px 16px}
.card-price{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.price{font-size:20px;font-weight:800;letter-spacing:-.03em}
.est{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.specs{margin-top:3px;font-size:14px;font-weight:600;color:var(--ink-2)}
.addr{
  margin-top:5px;font-size:13px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.meta{
  margin-top:8px;padding-top:9px;border-top:1px solid var(--line-2);
  font-size:12px;color:#8a97a8;font-weight:500;
  display:flex;justify-content:space-between;gap:8px;
}

.more-wrap{display:flex;justify-content:center;margin-top:32px}
.more{
  height:46px;padding:0 32px;border-radius:999px;
  border:1.5px solid var(--brand);background:#fff;color:var(--brand);
  font-size:14.5px;font-weight:700;
}
.more:hover{background:var(--brand);color:#fff}

.empty{
  grid-column:1/-1;padding:64px 24px;text-align:center;
  border:1.5px dashed #d9e1ea;border-radius:var(--radius);background:#fff;
}
.empty h3{margin:0 0 6px;font-size:17px;font-weight:700}
.empty p{margin:0 auto;max-width:340px;font-size:13.5px;color:var(--muted);line-height:1.6}

.mapwrap{position:relative;border-left:1px solid var(--line);background:#e9eef3}
#map{position:absolute;inset:0}
.leaflet-container{font-family:inherit;background:#e9eef3}
.leaflet-control-attribution{
  font-size:10.5px !important;background:rgba(255,255,255,.85) !important;
  border-radius:6px 0 0 0;padding:2px 7px !important;
}

.pin{background:none;border:0}
.pin span{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  display:inline-block;padding:5px 10px;border-radius:999px;
  background:#fff;color:var(--ink);
  font-size:12px;font-weight:800;white-space:nowrap;
  border:1.5px solid #d8e0ea;
  box-shadow:0 3px 10px rgba(13,27,42,.16);
  cursor:pointer;
}
.pin:hover span,.pin.is-active span{
  background:var(--ink);color:#fff;border-color:var(--ink);
  transform:translate(-50%,-50%) scale(1.07);
  z-index:500;
}

.view-toggle{
  display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  z-index:650;padding:5px;border-radius:999px;
  background:rgba(255,255,255,.96);
  box-shadow:0 10px 30px rgba(13,27,42,.22);
  border:1px solid var(--line);
}
.view-toggle button{
  padding:9px 22px;border-radius:999px;
  font-size:13.5px;font-weight:700;color:var(--muted);
}
.view-toggle button.active{background:var(--ink);color:#fff}

/* ============================================================
   DETAIL DRAWER
   ============================================================ */
.scrim{
  position:fixed;inset:0;z-index:900;
  background:rgba(13,27,42,.42);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.scrim.show{opacity:1;pointer-events:auto}

.drawer{
  position:fixed;top:0;right:0;z-index:950;
  width:min(560px,100%);height:100%;
  background:#fff;box-shadow:var(--shadow-lg);
  transform:translateX(103%);
  transition:transform .28s cubic-bezier(.22,.9,.3,1);
  overflow-y:auto;
}
.drawer.open{transform:translateX(0)}

.drawer-hero{position:relative;aspect-ratio:16/10;background:#eef1f5}
.drawer-hero img{width:100%;height:100%;object-fit:cover}

.close-btn{
  position:absolute;top:14px;right:14px;z-index:3;
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.96);
  box-shadow:0 3px 12px rgba(13,27,42,.2);
}
.close-btn svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.2;fill:none}

.drawer-body{padding:22px 26px 70px}
.drow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.drawer .price-lg{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.drawer .specs-lg{margin-top:6px;font-size:15px;font-weight:600;color:var(--ink-2)}
.drawer .addr-lg{margin-top:4px;font-size:13.5px;color:var(--muted)}

.heart-lg{
  flex:0 0 auto;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  border:1.5px solid var(--line);background:#fff;
}
.heart-lg svg{width:21px;height:21px;stroke:#7a8798;fill:transparent;stroke-width:1.9}
.heart-lg.on{border-color:#f6cfcc;background:#fff5f5}
.heart-lg.on svg{fill:#e8453c;stroke:#e8453c}

.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{
  padding:6px 12px;border-radius:999px;
  background:#f4f6fa;border:1px solid var(--line-2);
  font-size:12px;font-weight:600;color:var(--ink-2);
}
.pill.brand{background:var(--brand-soft);border-color:#d6e4ff;color:var(--brand-dark)}

.section-title{margin:28px 0 10px;font-size:14px;font-weight:800}
.drawer p.desc{margin:0;font-size:14px;line-height:1.65;color:#46586c}

.calc{
  display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:end;
  padding:16px;border-radius:14px;
  background:linear-gradient(150deg,#f7faff,#f1f6ff);
  border:1px solid #dfeaff;
}
.calc-out{font-size:12px;font-weight:600;color:var(--muted);line-height:1.3}
.calc-out strong{display:block;font-size:25px;font-weight:800;color:var(--ink)}
.calc label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.calc input{
  width:78px;height:36px;margin-top:5px;padding:0 10px;
  border:1px solid var(--line);border-radius:9px;background:#fff;
  font-size:14px;font-weight:600;outline:none;text-align:center;
}
.calc input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,95,255,.12)}
.calc-note{margin:9px 0 0;font-size:11.5px;color:#8a97a8;line-height:1.55}

.agent{
  display:flex;align-items:center;gap:13px;
  margin-top:20px;padding:14px;border-radius:14px;
  border:1px solid var(--line);background:#fff;
}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;
  background:linear-gradient(140deg,#2f7bff,#0b5fff);
  color:#fff;font-weight:800;font-size:15px;
}
.agent-info{flex:1;min-width:0}
.agent-info b{display:block;font-size:14px;font-weight:700}
.agent-info span{font-size:12.5px;color:var(--muted)}
.agent button{
  height:36px;padding:0 16px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;
}

.similar-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.mini{
  border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:#fff;cursor:pointer;
}
.mini:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.mini img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mini-body{padding:9px 11px 11px}
.mini-price{font-size:14.5px;font-weight:800}
.mini-specs{font-size:11.5px;color:var(--muted);margin-top:1px}
.mini-addr{font-size:11.5px;color:#8a97a8;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;left:50%;bottom:26px;z-index:1000;
  transform:translate(-50%,24px);
  display:flex;align-items:center;gap:9px;
  padding:12px 20px;border-radius:12px;
  background:var(--ink);color:#fff;
  font-size:13.5px;font-weight:600;
  box-shadow:0 14px 34px rgba(13,27,42,.32);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;stroke:#4ade80;fill:none;stroke-width:2.4}

/* ============================================================
   LIVE CHAT WIDGET
   ============================================================ */
.chat-root{position:fixed;right:22px;bottom:22px;z-index:970}
.chat-toggle{
  position:relative;width:60px;height:60px;border-radius:50%;
  background:linear-gradient(140deg,#2f7bff,#0b5fff 55%,#0640b5);
  color:#fff;display:grid;place-items:center;
  box-shadow:0 12px 32px rgba(11,95,255,.42);
  transition:transform .18s ease;
}
.chat-toggle:hover{transform:translateY(-2px) scale(1.04)}
.chat-toggle svg{width:26px;height:26px}
.chat-toggle .ic-close{display:none}
.chat-root.open .chat-toggle .ic-open{display:none}
.chat-root.open .chat-toggle .ic-close{display:block}

.chat-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:22px;height:22px;padding:0 6px;border-radius:999px;
  display:grid;place-items:center;
  background:#ff4d4f;color:#fff;font-size:11px;font-weight:800;
  border:2px solid #fff;
}
.chat-root.open .chat-badge{display:none}

.chat-panel{
  position:absolute;right:0;bottom:76px;
  width:min(384px, calc(100vw - 44px));
  height:min(580px, calc(100vh - 130px));
  background:#fff;border-radius:18px;border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden;
  transform-origin:bottom right;
  transform:scale(.92) translateY(12px);
  opacity:0;pointer-events:none;
  transition:transform .22s ease, opacity .18s ease;
}
.chat-root.open .chat-panel{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}

.chat-header{
  display:flex;align-items:center;gap:11px;padding:14px 16px;
  background:linear-gradient(140deg,#2f7bff,#0b5fff 60%,#0640b5);
  color:#fff;
}
.chat-avatar{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.2);
  display:grid;place-items:center;
  font-weight:800;font-size:13px;flex-shrink:0;
  border:2px solid rgba(255,255,255,.35);
}
.chat-header-text{flex:1;min-width:0}
.chat-name{font-size:14px;font-weight:700}
.chat-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.88);margin-top:1px}
.chat-status .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.chat-close{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.15);color:#fff;
  display:grid;place-items:center;
}
.chat-close svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none}

.chat-messages{
  flex:1;padding:16px 16px 8px;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;background:#f7f9fc;
}
.chat-msg{display:flex}
.chat-msg--user{justify-content:flex-end}
.chat-bubble{
  max-width:82%;padding:10px 13px;border-radius:14px;
  font-size:13.5px;line-height:1.5;word-wrap:break-word;
}
.chat-msg--bot .chat-bubble{

}

@media (max-width:1000px){

  .results{padding:0 16px 90px}

  .filters{

  .btn-saved .label{display:none}
  .searchbar input{height:40px;font-size:14px}
  .results-head{flex-direction:column;align-items:flex-start;gap:10px}
  .grid{grid-template-columns:1fr;gap:16px}
  .card-media{aspect-ratio:16/10}
  .similar-grid{grid-template-columns:1fr}
  .drawer-body{padding:18px 18px 60px}
  .drawer .price-lg{font-size:25px}
  .calc{grid-template-columns:1fr 1fr;gap:12px}
  .calc-out{grid-column:1/-1}
  .nav-link{display:none}
  .chat-root{right:14px;bottom:14px}
  .chat-toggle{width:54px;height:54px}
  .chat-panel{width:calc(100vw - 28px);height:min(540px,calc(100vh - 100px));bottom:68px}
}

@media (prefers-reduced-motion:reduce){

<!-- ============================ HEADER ============================ -->

</header>

<!-- ============================ APP ============================ -->

    <label class="field">
      <span>Max price</span>

        <select id="maxPrice">

          <option value="750000">$750,000</option>
          <option value="1000000">$1,000,000</option>
          <option value="2000000">$2,000,000</option>

          <option value="3">3+</option>
          <option value="4">4+</option>
          <option value="5">5+</option>
        </select>
      </div>

    <label class="field">
      <span>Baths</span>
      <div class="select-wrap">
        <select id="baths">

          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+</option>
        </select>
      </div>
    </label>

    <label class="field">

      <div class="select-wrap">
        <select id="type">
          <option value="">All types</option>
          <option value="SINGLE_FAMILY">Single family</option>
          <option value="CONDO">Condo</option>
          <option value="TOWNHOUSE">Townhouse</option>
          <option value="MULTI_FAMILY">Multi-family</option>
        </select>

    </label>

    <label class="field">

  /* ==================================================================
     2. UTILITIES
     ================================================================== */

  const $ = (sel, el = document) => el.querySelector(sel);

  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  const fmtUSD = n => n == null ? '—' : new Intl.NumberFormat('en-US', {
    style:'currency', currency:'USD', maximumFractionDigits:0
  }).format(n);

  const fmtNum = n => n == null ? '—' : new Intl.NumberFormat('en-US').format(n);

  function shortPrice(n) {
    if (n == null) return '—';
    if (n >= 1000000) return '$' + (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return '$' + Math.round(n / 1000) + 'K';
    return '$' + n;
  }

  function timeAgo(ts) {
    const d = Math.floor((Date.now() - ts) / 86400000);
    if (d <= 0) return 'today';
    if (d === 1) return '1 day ago';
    if (d < 30) return d + ' days ago';
    const m = Math.floor(d / 30);
    return m === 1 ? '1 month ago' : m + ' months ago';
  }

  function monthlyPayment(price, downPct, ratePct) {
    const principal = price * (1 - downPct / 100);
    const r = ratePct / 100 / 12;
    const n = 360;
    if (r <= 0) return principal / n;
    return (principal * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  }

  function debounce(fn, ms) {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function initials(name) {
    return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  }

  const TYPE_LABEL = {
    SINGLE_FAMILY: 'Single family',
    CONDO: 'Condo',
    TOWNHOUSE: 'Townhouse',
    MULTI_FAMILY: 'Multi-family'
  };

  const STATUS_LABEL = { FOR_SALE: 'For sale', PENDING: 'Pending', SOLD: 'Sold' };

  /* ==================================================================
     3. STATE
     ================================================================== */

  const SAVED_KEY = 'nestview_saved_v2';

  const state = {
    q: '',
    min: '',
    max: '',
    beds: '',
    baths: '',
    type: '',
    status: 'FOR_SALE',
    sort: 'newest',
    savedOnly: false,
    shown: 12,
    pageSize: 12
  };

  let saved = new Set();
  try {
    saved = new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'));
  } catch (e) { saved = new Set(); }

  function persistSaved() {
    try {
      localStorage.setItem(SAVED_KEY, JSON.stringify([...saved]));
    } catch (e) {}
  }

  /* ==================================================================
     4. FILTER + SORT
     ================================================================== */

  function filtered() {
    const q = state.q.trim().toLowerCase();

    let out = LISTINGS.filter(l => {
      if (q) {
        const hay = (l.address + ' ' + l.city + ' ' + l.state + ' ' + l.zip + ' ' + l.city + ', ' + l.state).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (state.min && l.price < +state.min) return false;
      if (state.max && l.price > +state.max) return false;
      if (state.beds && l.beds < +state.beds) return false;
      if (state.baths && l.baths < +state.baths) return false;
      if (state.type && l.type !== state.type) return false;
      if (state.status && l.status !== state.status) return false;
      if (state.savedOnly && !saved.has(l.id)) return false;
      return true;
    });

    switch (state.sort) {
      case 'price_asc':  out.sort((a, b) => a.price - b.price); break;
      case 'price_desc': out.sort((a, b) => b.price - a.price); break;
      case 'sqft_desc':  out.sort((a, b) => b.sqft - a.sqft); break;
      case 'beds_desc':  out.sort((a, b) => b.beds - a.beds); break;
      default:           out.sort((a, b) => b.listedAt - a.listedAt);
    }
    return out;
  }

  /* ==================================================================
     5. MAP
     ================================================================== */

  let map = null;
  let pinLayer = null;
  const pinById = new Map();
  let activePinId = null;

  function initMap() {
    if (typeof L === 'undefined') return;

    map = L.map('map', {
      zoomControl: false,
      attributionControl: true,
      scrollWheelZoom: true
    }).setView([39.5, -98.35], 4);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    pinLayer = L.layerGroup().addTo(map);
  }

  function pinIcon(price) {
    return L.divIcon({
      className: 'pin',
      html: '<span>' + esc(shortPrice(price)) + '</span>',
      iconSize: [0, 0],
      iconAnchor: [0, 0]
    });
  }

  function renderPins(list) {
    if (!map || !pinLayer) return;

    pinLayer.clearLayers();
    pinById.clear();
    activePinId = null;

    const bounds = [];

    list.forEach(l => {
      if (l.lat == null || l.lng == null) return;
      const marker = L.marker([l.lat, l.lng], {
        icon: pinIcon(l.price),
        riseOnHover: true,
        title: l.address + ', ' + l.city
      });

      marker.on('click', () => openDetail(l.id));
      marker.addTo(pinLayer);
      pinById.set(l.id, marker);
      bounds.push([l.lat, l.lng]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 13);
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [48, 48], maxZoom: 13 });
    }
  }

  function highlightPin(id) {
    if (activePinId != null && pinById.has(activePinId)) {
      const prev = pinById.get(activePinId).getElement();
      if (prev) prev.classList.remove('is-active');
    }
    activePinId = id;
    if (id != null && pinById.has(id)) {
      const el = pinById.get(id).getElement();
      if (el) el.classList.add('is-active');
    }
  }

  /* ==================================================================
     6. RENDER — RESULTS
     ================================================================== */

  let currentResults = [];

  function render() {
    currentResults = filtered();
    renderHead();
    renderGrid();
    renderPins(currentResults);
    syncSavedUI();
  }

  function renderHead() {
    const title = $('#resultsTitle');
    const sub = $('#resultsSub');
    const total = currentResults.length;

    if (state.savedOnly) {
      title.textContent = 'Saved homes';
      sub.textContent = total === 0
        ? 'Tap the heart on any listing to save it here.'
        : total + (total === 1 ? ' home' : ' homes') + ' in your collection';
      return;
    }

    const label = state.status ? STATUS_LABEL[state.status] : 'Homes';
    title.textContent = label === 'For sale' ? 'Homes for sale' : label + ' homes';
    sub.textContent = total + (total === 1 ? ' listing' : ' listings') +
      (state.q ? ' matching “' + state.q + '”' : ' available right now');
  }

  function cardHTML(l) {
    const isSaved = saved.has(l.id);
    const fallback = 'https://picsum.photos/seed/nestview' + l.id + '/900/675';

    return '' +
      '<article class="card" data-id="' + l.id + '" tabindex="0" ' +
        'aria-label="' + esc(l.address + ', ' + l.city) + ' — ' + fmtUSD(l.price) + '">' +
        '<div class="card-media">' +
          '<img src="' + esc(l.img) + '" alt="Photo of ' + esc(l.address) + '" loading="lazy" ' +
               'onerror="this.onerror=null;this.src=\'' + fallback + '\'">' +
          '<span class="badge badge--' + l.status.toLowerCase() + '">' + esc(STATUS_LABEL[l.status]) + '</span>' +
          '<button class="heart' + (isSaved ? ' on' : '') + '" data-fav="' + l.id + '" ' +
                  'aria-label="' + (isSaved ? 'Remove from saved' : 'Save home') + '">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.4-4.6-9.2-8.9C1.4 8.1 3.5 4.8 6.9 4.8c2 0 3.5 1 4.4 2.3.9-1.3 2.4-2.3 4.4-2.3 3.4 0 5.5 3.3 4.1 6.8-1.8 4.3-9.2 8.9-9.2 8.9z"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-price">' +
            '<span class="price">' + fmtUSD(l.price) + '</span>' +
            '<span class="est">' + fmtUSD(Math.round(monthlyPayment(l.price, 20, 6.5))) + '/mo</span>' +
          '</div>' +
          '<div class="specs">' + l.beds + ' bds · ' + l.baths + ' ba · ' + fmtNum(l.sqft) + ' sqft</div>' +
          '<div class="addr">' + esc(l.address) + ', ' + esc(l.city) + ', ' + esc(l.state) + ' ' + esc(l.zip) + '</div>' +
          '<div class="meta"><span>' + esc(TYPE_LABEL[l.type] || l.subtype) + '</span><span>' + timeAgo(l.listedAt) + '</span></div>' +
        '</div>' +
      '</article>';
  }

  function emptyHTML() {
    if (state.savedOnly) {
      return '<div class="empty"><h3>No saved homes yet</h3><p>Tap the heart icon on any listing and it will show up here, saved on this device.</p></div>';
    }
    return '<div class="empty"><h3>No homes match those filters</h3><p>Try widening your price range, removing a bedroom minimum, or searching a nearby city.</p></div>';
  }

  function renderGrid() {
    const grid = $('#grid');
    const visible = currentResults.slice(0, state.shown);

    grid.innerHTML = visible.length ? visible.map(cardHTML).join('') : emptyHTML();
    $('#moreBtn').hidden = state.savedOnly || visible.length >= currentResults.length;
  }

  /* ==================================================================
     7. SAVED HOMES
     ================================================================== */

  function syncSavedUI() {
    $('#savedCount').textContent = saved.size;
    const btn = $('#savedBtn');
    btn.classList.toggle('active', state.savedOnly);
    btn.setAttribute('aria-pressed', state.savedOnly);
  }

  function toggleSaved(id) {
    const wasSaved = saved.has(id);
    if (wasSaved) saved.delete(id);
    else saved.add(id);
    persistSaved();

    document.querySelectorAll('[data-fav="' + id + '"]').forEach(el => {
      el.classList.toggle('on', !wasSaved);
      el.setAttribute('aria-label', wasSaved ? 'Save home' : 'Remove from saved');
    });

    syncSavedUI();
    if (state.savedOnly) render();
    toast(wasSaved ? 'Removed from saved homes' : 'Saved to your homes');
  }

  /* ==================================================================
     8. DETAIL DRAWER — includes real Zillow facts
     ================================================================== */

  const drawer = $('#drawer');
  const scrim = $('#scrim');
  let activeDetailId = null;

  function factRow(label, value) {
    if (value == null || value === '' || value === 0) return '';
    return '<div class="fact"><span>' + esc(label) + '</span><b>' + value + '</b></div>';
  }

  function detailHTML(l) {
    const isSaved = saved.has(l.id);
    const est = Math.round(monthlyPayment(l.price, 20, 6.5));
    const fallback = 'https://picsum.photos/seed/nestview' + l.id + '/1200/900';

    const facts = [
      factRow('Price / sqft', l.pricePerSqft ? '$' + l.pricePerSqft : null),
      factRow('Zestimate', l.zestimate ? fmtUSD(l.zestimate) : null),
      factRow('HOA', l.hoa ? '$' + fmtNum(l.hoa) + '/mo' : null),
      factRow('Year built', l.year),
      factRow('Lot size', l.lot ? fmtNum(l.lot) + ' sqft' : null),
      factRow('Property subtype', l.subtype ? esc(l.subtype) : null)
    ].filter(Boolean).join('');

    return '' +
      '<div class="drawer-hero">' +
        '<img src="' + esc(l.img) + '" alt="Photo of ' + esc(l.address) + '" ' +
             'onerror="this.onerror=null;this.src=\'' + fallback + '\'">' +
        '<button class="close-btn" id="closeDrawer" aria-label="Close details">' +
          '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
        '</button>' +
      '</div>' +

      '<div class="drawer-body">' +
        '<div class="drow">' +
          '<div>' +
            '<div class="price-lg">' + fmtUSD(l.price) + '</div>' +
            '<div class="specs-lg">' + l.beds + ' bds · ' + l.baths + ' ba · ' + fmtNum(l.sqft) + ' sqft</div>' +
            '<div class="addr-lg">' + esc(l.address) + ', ' + esc(l.city) + ', ' + esc(l.state) + ' ' + esc(l.zip) + '</div>' +
          '</div>' +
          '<button class="heart-lg' + (isSaved ? ' on' : '') + '" data-fav="' + l.id + '" ' +
                  'aria-label="' + (isSaved ? 'Remove from saved' : 'Save home') + '">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.4-4.6-9.2-8.9C1.4 8.1 3.5 4.8 6.9 4.8c2 0 3.5 1 4.4 2.3.9-1.3 2.4-2.3 4.4-2.3 3.4 0 5.5 3.3 4.1 6.8-1.8 4.3-9.2 8.9-9.2 8.9z"/></svg>' +
          '</button>' +
        '</div>' +

        '<div class="pillrow">' +
          '<span class="pill brand">' + esc(STATUS_LABEL[l.status]) + '</span>' +
          '<span class="pill">' + esc(TYPE_LABEL[l.type] || l.subtype) + '</span>' +
          '<span class="pill">Built ' + l.year + '</span>' +
          (l.lot ? '<span class="pill">' + fmtNum(l.lot) + ' sqft lot</span>' : '') +
          '<span class="pill">Listed ' + timeAgo(l.listedAt) + '</span>' +
        '</div>' +

        (facts ? '<h3 class="section-title">Facts &amp; features</h3><div class="facts-grid">' + facts + '</div>' : '') +

        '<h3 class="section-title">About this home</h3>' +
        '<p class="desc">' + esc(l.description) + '</p>' +

        '<h3 class="section-title">Estimated monthly payment</h3>' +
        '<div class="calc">' +
          '<div class="calc-out"><strong id="calcOut">' + fmtUSD(est) + '</strong>principal &amp; interest</div>' +
          '<label>Down<input id="calcDown" type="number" min="0" max="90" step="5" value="20">%</label>' +
          '<label>Rate<input id="calcRate" type="number" min="0" max="15" step="0.1" value="6.5">%</label>' +
        '</div>' +
        '<p class="calc-note">Based on a 30-year fixed-rate loan. Taxes, insurance, and HOA dues are not included.</p>' +

        '<div class="agent">' +
          '<div class="avatar">' + esc(initials(l.agent.name)) + '</div>' +
          '<div class="agent-info"><b>' + esc(l.agent.name) + '</b><span>' + esc(l.agent.title) + '</span></div>' +
          '<button type="button" data-contact>Contact</button>' +
        '</div>' +

        '<h3 class="section-title">Similar homes nearby</h3>' +
        '<div class="similar-grid" id="similarGrid"></div>' +
      '</div>';
  }

  function similarFor(l) {
    const lo = l.price * 0.55;
    const hi = l.price * 1.45;

    return LISTINGS
      .filter(x => x.id !== l.id && x.city === l.city && x.price >= lo && x.price <= hi)
      .sort((a, b) => Math.abs(a.price - l.price) - Math.abs(b.price - l.price))
      .slice(0, 4);
  }

  function renderSimilar(l) {
    const grid = $('#similarGrid');
    if (!grid) return;

    const items = similarFor(l);

    if (!items.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;font-size:13px;color:#8a97a8">No similar homes found nearby.</div>';
      return;
    }

    grid.innerHTML = items.map(x => {
      const fb = 'https://picsum.photos/seed/nestview' + x.id + '/600/450';
      return '' +
        '<div class="mini" data-id="' + x.id + '" role="button" tabindex="0">' +
          '<img src="' + esc(x.img) + '" alt="Photo of ' + esc(x.address) + '" loading="lazy" ' +
               'onerror="this.onerror=null;this.src=\'' + fb + '\'">' +
          '<div class="mini-body">' +
            '<div class="mini-price">' + fmtUSD(x.price) + '</div>' +
            '<div class="mini-specs">' + x.beds + ' bd · ' + x.baths + ' ba · ' + fmtNum(x.sqft) + ' sqft</div>' +
            '<div class="mini-addr">' + esc(x.address) + '</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function bindCalculator(price) {
    const out = $('#calcOut');
    const down = $('#calcDown');
    const rate = $('#calcRate');
    if (!out || !down || !rate) return;

    const update = () => {
      const d = Math.min(Math.max(parseFloat(down.value) || 0, 0), 90);
      const r = Math.min(Math.max(parseFloat(rate.value) || 0, 0), 15);
      out.textContent = fmtUSD(Math.round(monthlyPayment(price, d, r)));
    };

    down.addEventListener('input', update);
    rate.addEventListener('input', update);
  }

  function openDetail(id) {
    const listing = LISTINGS.find(x => x.id === id);
    if (!listing) return;

    activeDetailId = id;

    drawer.innerHTML = detailHTML(listing);
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
    drawer.scrollTop = 0;
    scrim.classList.add('show');

    bindCalculator(listing.price);
    renderSimilar(listing);
    highlightPin(id);

    if (map) {
      const marker = pinById.get(id);
      if (marker) map.panTo(marker.getLatLng(), { animate: true });
    }

    $('#closeDrawer').focus({ preventScroll: true });
  }

  function closeDrawer() {
    activeDetailId = null;
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    scrim.classList.remove('show');
    highlightPin(null);
  }

  /* ==================================================================
     9. TOAST
     ================================================================== */

  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    $('#toastMsg').textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
  }

  /* ==================================================================
     10. MOBILE PANELS
     ================================================================== */

  const filtersPanel = $('#filters');

  function openFilters() {
    filtersPanel.classList.add('open');
    scrim.classList.add('show');
  }

  function closeFilters() {
    filtersPanel.classList.remove('open');
    if (!drawer.classList.contains('open')) scrim.classList.remove('show');
  }

  /* ==================================================================
     11. LIVE CHAT WIDGET
     ================================================================== */

  const chatRoot     = $('#chatRoot');
  const chatPanel    = $('#chatPanel');
  const chatToggle   = $('#chatToggle');
  const chatCloseBtn = $('#chatClose');
  const chatMessages = $('#chatMessages');
  const chatForm     = $('#chatForm');
  const chatInput    = $('#chatInput');
  const chatQuick    = $('#chatQuick');

  const chatSeen = { greetingSent: false };

  const QUICK_REPLIES = [
    'Homes under $500k',
    'Show me condos',
    'How do I save a home?',
    'Schedule a tour'
  ];

  function addChatMessage(html, from) {
    const row = document.createElement('div');
    row.className = 'chat-msg chat-msg--' + from;
    row.innerHTML = '<div class="chat-bubble">' + html + '</div>';
    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function botSay(html) {
    const typing = document.createElement('div');
    typing.className = 'chat-msg chat-msg--bot';
    typing.innerHTML = '<div class="chat-bubble chat-typing"><span></span><span></span><span></span></div>';
    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    setTimeout(() => {
      typing.remove();
      addChatMessage(html, 'bot');
    }, 520 + Math.random() * 480);
  }

  function summarySentence() {
    const total = currentResults.length;
    if (!total) return 'Right now <b>no</b> homes match your filters — try widening them on the left.';
    let lo = Infinity, hi = -Infinity;
    currentResults.forEach(l => { if (l.price < lo) lo = l.price; if (l.price > hi) hi = l.price; });
    return `Right now <b>${total}</b> ${total === 1 ? 'home is' : 'homes are'} showing, from <b>${fmtUSD(lo)}</b> to <b>${fmtUSD(hi)}</b>.`;
  }

  function botGreeting() {
    return `Hi there 👋 I'm your NestView assistant. I can help you explore real listings, compare prices, or connect with an agent.<br><br>${summarySentence()}<br><br>What are you looking for?`;
  }

  function botResponse(raw) {
    const t = raw.toLowerCase();
    const total = currentResults.length;

    if (/^(hi|hello|hey|yo)\b/.test(t)) {
      return `Hi! ${summarySentence()} Ask me about a city, a price range, bedrooms, condos, or scheduling a tour.`;
    }

    if (/\b(thanks|thank you|thx)\b/.test(t)) {
      return `You're welcome! Anything else I can help with?`;
    }

    const bedNum = t.match(/(\d+)\s*\+?\s*(?:bed|bedroom|bd|br)\b/);
    if (bedNum) {
      const n = parseInt(bedNum[1], 10);
      if (!total) return `No homes in your current results. Try clearing a filter on the left.`;
      const matches = currentResults.filter(l => l.beds >= n);
      if (!matches.length) return `None of your current results have <b>${n}+ bedrooms</b>. Try lowering the beds filter.`;
      let lo = Infinity, hi = -Infinity;
      matches.forEach(l => { if (l.price < lo) lo = l.price; if (l.price > hi) hi = l.price; });
      return `<b>${matches.length}</b> homes in your current results have <b>${n}+ bedrooms</b>, from <b>${fmtUSD(lo)}</b> to <b>${fmtUSD(hi)}</b>. Set the <b>Beds</b> filter to ${n}+ to see them all.`;
    }

    if (/\b(condo|townhouse|townhome|single family)\b/.test(t)) {
      const want = t.includes('condo') ? 'CONDO' : t.includes('town') ? 'TOWNHOUSE' : 'SINGLE_FAMILY';
      const matches = LISTINGS.filter(l => l.type === want && l.status === 'FOR_SALE');
      if (!matches.length) return `I don't have any ${want.toLowerCase().replace('_', ' ')} listings for sale right now.`;
      let lo = Infinity, hi = -Infinity;
      matches.forEach(l => { if (l.price < lo) lo = l.price; if (l.price > hi) hi = l.price; });
      return `<b>${matches.length}</b> ${TYPE_LABEL[want].toLowerCase()} listings for sale, from <b>${fmtUSD(lo)}</b> to <b>${fmtUSD(hi)}</b>. Use the <b>Home type</b> filter to narrow the list.`;
    }

    if (/\b(price|cost|budget|afford|cheap|expensive|median|average)\b/.test(t)) {
      if (!total) return `Nothing matches your filters right now. Widen them and ask again.`;
      const sorted = currentResults.map(l => l.price).sort((a, b) => a - b);
      const median = sorted[Math.floor(sorted.length / 2)];
      return `${summarySentence()} The median is about <b>${fmtUSD(median)}</b>. Use the sort dropdown above the results to reorder by price.`;
    }

    if (/\b(save|saved|favorite|heart|wishlist)\b/.test(t)) {
      return `Tap the ♥ on any listing to save it. Saved homes appear under the <b>Saved</b> button at the top and stay on this device. You currently have <b>${saved.size}</b> saved.`;
    }

    if (/\b(contact|agent|tour|showing|visit|appointment|schedule|call|meet)\b/.test(t)) {
      return `Open any home and click <b>Contact</b> to reach its listing agent. Want me to narrow things down first? Try “homes under $500k” or a city like “Austin”.`;
    }

    if (/\b(map|location|where|area|neighborhood)\b/.test(t)) {
      return `Use the interactive map — each price pin opens that home. On mobile, tap the <b>Map</b> toggle at the bottom to switch views.`;
    }

    if (/\b(filter|sort|search|narrow|refine)\b/.test(t)) {
      return `Use the filters on the left to set price, beds, baths, and home type. Results update instantly, and the <b>Sort</b> dropdown reorders them.`;
    }

    if (/\b(mortgage|payment|finance|loan|down payment|interest|monthly)\b/.test(t)) {
      return `Every listing shows an estimated monthly payment. Open a home and use the calculator to adjust the down payment and interest rate — it updates live.`;
    }

    if (/\b(hoa|zestimate|price per sqft|price\/sqft)\b/.test(t)) {
      return `Open any listing — the <b>Facts &amp; features</b> section shows the real HOA fee, Zestimate, and price per square foot from Zillow.`;
    }

    const cityHit = ['Gainesville','Keller','Roselle','Oak Park','Dubuque','Celina','Nashville','Mount Pleasant','Memphis','Miami','New York']
      .find(c => t.includes(c.toLowerCase()));
    if (cityHit) {
      const inCity = LISTINGS.filter(l => l.city === cityHit);
      const forSale = inCity.filter(l => l.status === 'FOR_SALE');
      if (!inCity.length) return `I don't have any homes in ${cityHit} right now.`;
      if (!forSale.length) return `${cityHit} — nothing is currently for sale there, but check the Pending and Sold statuses.`;
      let lo = Infinity, hi = -Infinity;
      forSale.forEach(l => { if (l.price < lo) lo = l.price; if (l.price > hi) hi = l.price; });
      return `<b>${cityHit}</b> — ${forSale.length} homes for sale, from <b>${fmtUSD(lo)}</b> to <b>${fmtUSD(hi)}</b>. Type the city name into the search bar to filter results.`;
    }

    const budget = t.match(/(?:under|below|less than|about|around|max|up to)?\s*\$?\s*([\d,.]+)\s*(k|thousand|m|million)?/);
    if (budget && /under|below|less than|about|around|max|up to|\$/.test(t)) {
      let n = parseFloat(budget[1].replace(/,/g, ''));
      const suf = (budget[2] || '').toLowerCase();
      if (suf === 'k' || suf === 'thousand') n *= 1000;
      else if (suf === 'm' || suf === 'million') n *= 1000000;
      else if (n < 10000) n *= 1000;
      if (isFinite(n) && n > 0) {
        const matches = LISTINGS.filter(l => l.status === 'FOR_SALE' && l.price <= n);
        if (!matches.length) return `Nothing under <b>${fmtUSD(n)}</b> right now — try a slightly higher budget.`;
        let lo = Infinity;
        matches.forEach(l => { if (l.price < lo) lo = l.price; });
        return `Found <b>${matches.length}</b> homes at or under <b>${fmtUSD(n)}</b>, starting at <b>${fmtUSD(lo)}</b>. Set the <b>Max price</b> filter to ${fmtUSD(n)} to see them all.`;
      }
    }

    return `${summarySentence()} Ask me about a city, a price range, bedrooms, condos, saving homes, or scheduling a tour.`;
  }

  function sendChatMessage(text) {
    text = String(text || '').trim();
    if (!text) return;
    addChatMessage(esc(text), 'user');
    chatInput.value = '';
    botSay(botResponse(text));
  }

  function openChat() {
    chatRoot.classList.add('open');
    chatPanel.setAttribute('aria-hidden', 'false');
    chatToggle.setAttribute('aria-expanded', 'true');
    if (!chatSeen.greetingSent) {
      chatSeen.greetingSent = true;
      setTimeout(() => addChatMessage(botGreeting(), 'bot'), 260);
    }
    setTimeout(() => chatInput.focus({ preventScroll: true }), 220);
  }

  function closeChat() {
    chatRoot.classList.remove('open');
    chatPanel.setAttribute('aria-hidden', 'true');
    chatToggle.setAttribute('aria-expanded', 'false');
  }

  function buildQuickReplies() {
    chatQuick.innerHTML = QUICK_REPLIES
      .map(t => '<button type="button" class="chat-chip">' + esc(t) + '</button>')
      .join('');
  }

  function bindChat() {
    buildQuickReplies();
    chatToggle.addEventListener('click', () => {
      if (chatRoot.classList.contains('open')) closeChat();
      else openChat();
    });
    chatCloseBtn.addEventListener('click', closeChat);
    chatForm.addEventListener('submit', e => {
      e.preventDefault();
      sendChatMessage(chatInput.value);
    });
    chatQuick.addEventListener('click', e => {
      const chip = e.target.closest('.chat-chip');
      if (chip) sendChatMessage(chip.textContent);
    });
  }

  /* ==================================================================
     12. EVENTS
     ================================================================== */

  function readControls() {
    state.min = $('#minPrice').value;
    state.max = $('#maxPrice').value;
    state.beds = $('#beds').value;
    state.baths = $('#baths').value;
    state.type = $('#type').value;
    state.status = $('#status').value;
    state.sort = $('#sortSelect').value;
  }

  function rerenderFromControls() {
    readControls();
    state.shown = state.pageSize;
    render();
    $('#resultsPane').scrollTop = 0;
  }

  function bindEvents() {
    ['#minPrice', '#maxPrice', '#beds', '#baths', '#type', '#status', '#sortSelect']
      .forEach(sel => {
        $(sel).addEventListener('change', () => {
          state.savedOnly = false;
          rerenderFromControls();
        });
      });

    $('#searchForm').addEventListener('submit', e => {
      e.preventDefault();
      state.q = $('#searchInput').value;
      state.savedOnly = false;
      state.shown = state.pageSize;
      render();
      $('#resultsPane').scrollTop = 0;
    });

    $('#searchInput').addEventListener('input', debounce(function () {
      const v = this.value;
      if (v === state.q) return;
      state.q = v;
      state.savedOnly = false;
      state.shown = state.pageSize;
      render();
    }, 320));

    $('#savedBtn').addEventListener('click', () => {
      state.savedOnly = !state.savedOnly;
      state.shown = state.pageSize;
      render();
      $('#resultsPane').scrollTop = 0;
    });

    $('#resetBtn').addEventListener('click', () => {
      ['#minPrice', '#maxPrice', '#beds', '#baths', '#type', '#searchInput']
        .forEach(sel => { $(sel).value = ''; });
      $('#status').value = 'FOR_SALE';
      $('#sortSelect').value = 'newest';
      state.q = '';
      state.savedOnly = false;
      rerenderFromControls();
      toast('Filters cleared');
    });

    $('#moreBtn').addEventListener('click', () => {
      state.shown += state.pageSize;
      renderGrid();
    });

    $('#filterBtn').addEventListener('click', openFilters);

    document.querySelectorAll('.view-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const showMap = btn.dataset.view === 'map';
        document.body.classList.toggle('show-map', showMap);
        if (showMap && map) setTimeout(() => map.invalidateSize(), 60);
      });
    });

    scrim.addEventListener('click', () => {
      if (drawer.classList.contains('open')) closeDrawer();
      else closeFilters();
    });

    document.addEventListener('click', e => {
      if (e.target.closest('#closeDrawer')) { closeDrawer(); return; }

      const favBtn = e.target.closest('[data-fav]');
      if (favBtn) {
        e.preventDefault();
        e.stopPropagation();
        toggleSaved(Number(favBtn.dataset.fav));
        return;
      }

      if (e.target.closest('[data-contact]')) { toast('An agent will reach out shortly'); return; }
      if (e.target.closest('#alertBtn')) { toast('Price alert created for this search'); return; }

      const target = e.target.closest('.card[data-id], .mini[data-id]');
      if (target) openDetail(Number(target.dataset.id));
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (drawer.classList.contains('open')) { closeDrawer(); return; }
        if (chatRoot.classList.contains('open')) { closeChat(); return; }
        if (filtersPanel.classList.contains('open')) { closeFilters(); return; }
        return;
      }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-id], .mini[data-id]')) {
        e.preventDefault();
        openDetail(Number(e.target.dataset.id));
      }
    });

    const grid = $('#grid');
    grid.addEventListener('mouseover', e => {
      const card = e.target.closest('.card[data-id]');
      if (card) highlightPin(Number(card.dataset.id));
    });
    grid.addEventListener('mouseout', e => {
      const card = e.target.closest('.card[data-id]');
      if (card && activeDetailId == null) highlightPin(null);
    });

    window.addEventListener('resize', debounce(() => {
      if (map) map.invalidateSize();
    }, 180));
  }

  /* ==================================================================
     13. BOOT
     ================================================================== */

  function boot() {
    initMap();
    bindEvents();
    bindChat();
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

}

</style>
</body>
